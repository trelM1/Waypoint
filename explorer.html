<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Explorer View</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #cfe3f1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 6px; height: 6px; border-radius: 50%; background: white;
      box-shadow: 0 0 2px black; pointer-events: none; z-index: 2;
    }
    #backLink {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      background: rgba(0,0,0,0.6); color: white; padding: 6px 12px;
      border-radius: 6px; font-size: 13px; text-decoration: none;
    }

    /* ---------- edit panel ---------- */
    #ui {
      position: absolute; top: 12px; right: 12px; z-index: 3; width: 264px;
      max-height: calc(100% - 24px); overflow-y: auto;
      background: rgba(255,255,255,0.94); color: #14202b;
      border-radius: 12px; padding: 14px; font-size: 12.5px;
      box-shadow: 0 8px 30px rgba(20,32,43,0.25);
    }
    #ui h2 { margin: 0 0 6px; font-size: 14px; }
    #ui h3 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #6b7a89; }
    #ui .note { color: #6b7a89; font-size: 11.5px; }
    #sel { background: #f4f8fb; border: 1px solid #e3e9ef; border-radius: 8px; padding: 8px 10px; min-height: 34px; }
    #ui button {
      width: 100%; margin-top: 6px; padding: 7px 10px; border: 0; border-radius: 8px;
      background: #1d8fe1; color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    #ui button:hover { background: #1673b8; }
    #ui button.secondary { background: #e9eff5; color: #14202b; }
    #ui button.secondary:hover { background: #dbe5ee; }
    #ui .row { display: flex; gap: 6px; }
    #ui .row button { margin-top: 6px; }
    #ui label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
    #ui input[type=number] { width: 70px; }
    #ui input[type=file] { width: 100%; margin-top: 4px; font-size: 11.5px; }
    #ui select { max-width: 150px; }
    kbd {
      font-family: inherit; font-size: 10.5px; font-weight: 600;
      background: rgba(0,0,0,0.12); border-radius: 4px; padding: 1px 5px;
    }
    #ui button:not(.secondary) kbd { background: rgba(255,255,255,0.28); }
    #pending { margin-top: 8px; color: #b45309; font-size: 11.5px; }
    #toast {
      position: absolute; bottom: 24px; left: 50%; transform: translate(-50%, 10px); opacity: 0;
      background: #14202b; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 999px;
      pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #attribution {
      position: absolute; right: 12px; bottom: 8px; z-index: 2;
      font-size: 11px; color: #fff; background: rgba(0,0,0,0.45);
      padding: 2px 8px; border-radius: 4px;
    }
    #attribution a { color: #fff; text-decoration: none; }
    #attribution a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <a id="backLink" href="map-picker.html">&larr; Back to picker</a>

  <div id="ui">
    <h2>Edit buildings</h2>
    <div id="sel">Nothing selected.</div>
    <div class="row">
      <button id="btnDelete">Delete <kbd>X</kbd></button>
      <button id="btnUndo" class="secondary">Undo <kbd>Z</kbd></button>
      <button id="btnPreviewReal" class="secondary">See it for real <kbd>V</kbd></button>
    </div>

    <h3>3D model (.glb)</h3>
    <input type="file" id="modelFile" accept=".glb,.gltf" multiple>
    <label>Active model <select id="modelSelect"><option value="">(none loaded)</option></select></label>
    <label>Fit
      <select id="fitMode">
        <option value="uniform">Fit footprint (keep shape)</option>
        <option value="stretch">Stretch to footprint</option>
        <option value="keep">Keep original size</option>
      </select>
    </label>
    <label>Height (m, 0 = auto) <input type="number" id="modelHeight" value="0" min="0" step="1"></label>
    <button id="btnReplaceModel">Replace selected with model <kbd>R</kbd></button>
    <button id="btnPlaceModel">Place model at crosshair <kbd>P</kbd></button>

    <h3>Layout</h3>
    <div class="row">
      <button id="btnExport" class="secondary">Export</button>
      <button id="btnImport" class="secondary">Import</button>
      <button id="btnReset" class="secondary">Reset</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <div class="note" id="counts" style="margin-top:8px"></div>
    <div id="pending"></div>
    <div class="note" style="margin-top:8px">Edits autosave in this browser. Press Esc to free the mouse before using the panel. Model files are not saved &mdash; re-select them after a reload and placements reappear.</div>
  </div>

  <div id="toast"></div>

  <!-- Shown once satellite imagery or terrain data has actually loaded -->
  <div id="attribution" hidden>
    <a href="https://www.mapbox.com/about/maps/" target="_blank" rel="noopener">&copy; Mapbox</a>
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap</a>
    <a id="maxarLink" href="https://www.maxar.com/" target="_blank" rel="noopener">&copy; Maxar</a>
  </div>

  <!-- gitignored; defines: const MAPBOX_TOKEN = "pk...."; -->
  <script src="config.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

    const $ = (id) => document.getElementById(id);

    // =====================================================================
    // 1. Read the selection passed in from the picker
    // =====================================================================
    console.log("explorer.html v5.5 (satellite ground, detailed buildings, sturdier map-data loading)");
    const params = new URLSearchParams(window.location.search);
    let centerLat = parseFloat(params.get("lat"));
    let centerLng = parseFloat(params.get("lng"));
    const radiusMeters = parseFloat(params.get("radius")) || 300;

    // If this page is opened directly (no ?lat=&lng=), fall back to UWaterloo so it still works.
    if (!Number.isFinite(centerLat) || !Number.isFinite(centerLng)) {
      console.warn("No lat/lng in the URL - using UWaterloo as a fallback.");
      centerLat = 43.4723;
      centerLng = -80.5449;
    }

    const HAS_TOKEN = typeof MAPBOX_TOKEN !== "undefined" && !!MAPBOX_TOKEN;

    // =====================================================================
    // 2. Renderer, camera, sky, lighting
    // =====================================================================
    const HORIZON = 0xcfe3f1; // sky colour at the horizon; fog uses the same colour

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(HORIZON);
    scene.fog = new THREE.Fog(HORIZON, 60, radiusMeters * 2.5);

    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.5, 5000
    );
    camera.position.set(0, 10, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Sky dome: a big sphere with a vertical gradient that follows the camera
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(3000, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x4a90d9) },
          horizonColor: { value: new THREE.Color(HORIZON) }
        },
        vertexShader: `
          varying vec3 vDir;
          void main() {
            vDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 horizonColor;
          varying vec3 vDir;
          void main() {
            float h = clamp(vDir.y, 0.0, 1.0);
            gl_FragColor = vec4(mix(horizonColor, topColor, pow(h, 0.55)), 1.0);
            #include <colorspace_fragment>
          }`
      })
    );
    sky.renderOrder = -1;
    scene.add(sky);

    // Soft sky/ground light + a sun that casts shadows
    scene.add(new THREE.HemisphereLight(0xbfdcff, 0x8a8f7a, 0.9));

    const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
    sun.position.set(radiusMeters * 0.7, radiusMeters * 1.3, radiusMeters * 0.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    const sc = sun.shadow.camera;
    sc.left = -radiusMeters * 1.3; sc.right = radiusMeters * 1.3;
    sc.top = radiusMeters * 1.3;   sc.bottom = -radiusMeters * 1.3;
    sc.near = 1; sc.far = radiusMeters * 5;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.4;
    scene.add(sun);
    scene.add(sun.target);

    // Base ground (big, so its edge is always hidden by fog). The terrain mesh (section 4b) sits just above it.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(radiusMeters * 12, radiusMeters * 12),
      new THREE.MeshStandardMaterial({ color: 0xa4ae95, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    ground.receiveShadow = true;
    scene.add(ground);

    // =====================================================================
    // 3. Materials - no image textures on buildings. Walls, roofs and all building detail are flat vertex colours;
    //    windows, doors and trim are real geometry (see "Building detail" below).
    //    (The Mapbox satellite photo is used for the ground only; ?sat=0 turns it off, ?sat=roofs also puts it on roofs.)
    // =====================================================================
    const roofMat   = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, side: THREE.DoubleSide });
    const wallMat   = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, side: THREE.DoubleSide });
    const glassMat  = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.35, metalness: 0.1, side: THREE.DoubleSide });
    const detailMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
    const windowMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.14, metalness: 0.3, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });

    // =====================================================================
    // 4. Coordinate helpers
    // =====================================================================
    // Local coordinates: x = east (m), north (m). In the 3D world north is -z.
    function latLngToLocal(lat, lng, originLat, originLng) {
      const metersPerDegLat = 111320;
      const metersPerDegLng = 111320 * Math.cos(originLat * Math.PI / 180);
      return [(lng - originLng) * metersPerDegLng, (lat - originLat) * metersPerDegLat];
    }
    const toWorld = (lat, lon) => {
      const [x, north] = latLngToLocal(lat, lon, centerLat, centerLng);
      return [x, -north];
    };
    const M_PER_DEG_LAT = 111320;
    const M_PER_DEG_LNG = 111320 * Math.cos(centerLat * Math.PI / 180);

    // Read a numeric OSM tag safely ("12 m" -> 12, junk -> fallback)
    function num(v, fallback) {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : fallback;
    }

    // Public Overpass servers are often busy (504 / timeouts), so: several mirrors, one retry round, a 30 s timeout
    // per try, and the last good answer is cached in this browser so a busy server can't blank the map.
    // (Add ?refresh=1 to the URL to ignore the cache.)
    const OVERPASS_URLS = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass.private.coffee/api/interpreter",
      "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
      "https://overpass.openstreetmap.fr/api/interpreter"
    ];
    const overpassKey = (q) => {
      let h = 5381;
      for (let i = 0; i < q.length; i++) h = ((h << 5) + h + q.charCodeAt(i)) | 0;
      return "waypoint:overpass:" + (h >>> 0).toString(36);
    };
    const skipOverpassCache = new URLSearchParams(location.search).get("refresh") === "1";
    const overpassCooldown = {};   // mirror url -> timestamp before which we don't call it again

    async function fetchOverpass(query) {
      const key = overpassKey(query);
      if (!skipOverpassCache) {
        try {
          const cached = localStorage.getItem(key);
          if (cached) { console.log("Overpass: using the cached answer for this area (?refresh=1 to reload)"); return JSON.parse(cached); }
        } catch (e) { /* storage blocked or corrupt - just fetch */ }
      }
      let lastError;
      for (let round = 0; round < 3; round++) {
        let tried = 0;
        for (const url of OVERPASS_URLS) {
          // a mirror that just rate-limited us (429) or timed out is left alone for a while instead of being hammered
          if (Date.now() < (overpassCooldown[url] || 0)) continue;
          tried++;
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 30000);
          try {
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: "data=" + encodeURIComponent(query),
              signal: ctrl.signal
            });
            if (res.status === 429) overpassCooldown[url] = Date.now() + 60000;
            else if (res.status === 504 || res.status === 503) overpassCooldown[url] = Date.now() + 15000;
            if (!res.ok) throw new Error("HTTP " + res.status);
            const text = await res.text();
            const data = JSON.parse(text);   // throws if the server sent an error page
            if (!data.elements || (!data.elements.length && /error|timed out/i.test(data.remark || ""))) throw new Error(data.remark || "empty answer");
            try { localStorage.setItem(key, text); } catch (e) { /* too big for storage - fine */ }
            return data;
          } catch (err) {
            console.warn("Overpass failed at", url, err);
            lastError = err;
          } finally {
            clearTimeout(timer);
          }
        }
        if (round < 2) {
          toast("Map data server is busy - retrying...");
          // everything cooling down? wait for the soonest mirror; otherwise a short pause
          const soonest = Math.min(...OVERPASS_URLS.map((u) => overpassCooldown[u] || 0)) - Date.now();
          await new Promise((r) => setTimeout(r, tried ? 4000 : Math.min(Math.max(soonest, 2000), 20000)));
        }
      }
      toast("Couldn't load map data (servers busy). Reload in a minute.");
      throw lastError;
    }

    // Small polygon helpers (rings are arrays of [a, b] pairs; works in any 2D frame)
    function cleanRing(fp) {   // drop the repeated closing point and consecutive duplicates
      const out = [];
      for (const p of fp) {
        const q = out[out.length - 1];
        if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) > 0.01) out.push(p);
      }
      if (out.length > 1 && Math.hypot(out[0][0] - out[out.length - 1][0], out[0][1] - out[out.length - 1][1]) <= 0.01) out.pop();
      return out;
    }
    function signedArea(r) {
      let a = 0;
      for (let i = 0; i < r.length; i++) { const j = (i + 1) % r.length; a += r[i][0] * r[j][1] - r[j][0] * r[i][1]; }
      return a / 2;
    }
    const polyArea = (r) => Math.abs(signedArea(r));
    function isConvex(r) {
      let sign = 0;
      for (let i = 0; i < r.length; i++) {
        const a = r[i], b = r[(i + 1) % r.length], c = r[(i + 2) % r.length];
        const cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
        if (Math.abs(cross) < 1e-9) continue;
        const s = cross > 0 ? 1 : -1;
        if (sign && s !== sign) return false;
        sign = s;
      }
      return true;
    }
    function pointInRing(x, y, r) {
      let inside = false;
      for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
        const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    // Minimum-area oriented bounding box. U axis = (cos ang, sin ang); L (along U) >= W. Centre is (cx, cy).
    function orientedBox(pts) {
      let best = null;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        const c = Math.cos(ang), s = Math.sin(ang);
        let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
        for (const [x, y] of pts) {
          const u = x * c + y * s, v = -x * s + y * c;
          if (u < minU) minU = u; if (u > maxU) maxU = u;
          if (v < minV) minV = v; if (v > maxV) maxV = v;
        }
        const area = (maxU - minU) * (maxV - minV);
        if (!best || area < best.area) best = { ang, minU, maxU, minV, maxV, area };
      }
      let { ang, minU, maxU, minV, maxV } = best;
      if (maxV - minV > maxU - minU) {   // make the long side the U axis
        const nu0 = minV, nu1 = maxV, nv0 = -maxU, nv1 = -minU;
        ang += Math.PI / 2; minU = nu0; maxU = nu1; minV = nv0; maxV = nv1;
      }
      const c = Math.cos(ang), s = Math.sin(ang);
      const cu = (minU + maxU) / 2, cv = (minV + maxV) / 2;
      return { ang, c, s, L: maxU - minU, W: maxV - minV, cx: cu * c - cv * s, cy: cu * s + cv * c };
    }

    // =====================================================================
    // 4b. Terrain: a heightfield mesh under everything. Flat until real elevation data
    //     arrives (Mapbox Terrain-RGB); everything else asks elevationAt(x, z) for its height.
    //     The mesh covers +/- 2r; the +/- r middle square gets the ground/satellite texture and
    //     the outer ring is plain colour, with heights fading to 0 at the rim.
    // =====================================================================
    const TERRAIN_Y = -0.045;                 // sits just above the fallback ground plane (-0.05)
    const TERRAIN_N = 192;                    // cells per side (multiple of 4 so +/- r is a grid line)
    const TERRAIN_HALF = radiusMeters * 2;
    const TERRAIN_SEG = (TERRAIN_HALF * 2) / TERRAIN_N;
    const terrain = { heights: new Float32Array((TERRAIN_N + 1) * (TERRAIN_N + 1)), ready: false, relief: 0 };

    function elevationAt(x, z) {
      let fx = (x + TERRAIN_HALF) / TERRAIN_SEG, fz = (z + TERRAIN_HALF) / TERRAIN_SEG;
      fx = Math.min(Math.max(fx, 0), TERRAIN_N - 1e-6);
      fz = Math.min(Math.max(fz, 0), TERRAIN_N - 1e-6);
      const ix = Math.floor(fx), iz = Math.floor(fz), tx = fx - ix, tz = fz - iz;
      const W = TERRAIN_N + 1, h = terrain.heights;
      const h00 = h[iz * W + ix], h10 = h[iz * W + ix + 1], h01 = h[(iz + 1) * W + ix], h11 = h[(iz + 1) * W + ix + 1];
      return TERRAIN_Y + (h00 * (1 - tx) + h10 * tx) * (1 - tz) + (h01 * (1 - tx) + h11 * tx) * tz;
    }

    const terrainGeo = new THREE.BufferGeometry();
    {
      const N = TERRAIN_N, W = N + 1, H = TERRAIN_HALF, r = radiusMeters;
      const pos = new Float32Array(W * W * 3), uv = new Float32Array(W * W * 2);
      for (let iz = 0; iz < W; iz++) {
        for (let ix = 0; ix < W; ix++) {
          const i = iz * W + ix, x = -H + ix * TERRAIN_SEG, z = -H + iz * TERRAIN_SEG;
          pos[i * 3] = x; pos[i * 3 + 1] = TERRAIN_Y; pos[i * 3 + 2] = z;
          uv[i * 2] = (x + r) / (2 * r);       // u: west 0 -> east 1
          uv[i * 2 + 1] = (r - z) / (2 * r);   // v: south 0 -> north 1 (north = -z)
        }
      }
      const inner = [], outer = [];
      for (let cz = 0; cz < N; cz++) {
        for (let cx = 0; cx < N; cx++) {
          const a = cz * W + cx, b = a + 1, c = a + W, d = c + 1;
          const isInner = cx >= N / 4 && cx < (3 * N) / 4 && cz >= N / 4 && cz < (3 * N) / 4;
          (isInner ? inner : outer).push(a, c, b, b, c, d);   // counter-clockwise seen from above
        }
      }
      terrainGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      terrainGeo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      terrainGeo.setIndex(new THREE.Uint32BufferAttribute([...inner, ...outer], 1));
      terrainGeo.addGroup(0, inner.length, 0);
      terrainGeo.addGroup(inner.length, outer.length, 1);
      terrainGeo.computeVertexNormals();
    }
    const terrainMat = (extra) => new THREE.MeshStandardMaterial({
      color: 0xa4ae95, roughness: 1,
      polygonOffset: true, polygonOffsetFactor: -0.5, polygonOffsetUnits: -0.5, ...extra
    });
    const terrainInnerMat = terrainMat();   // gets the OSM-painted texture, then the satellite imagery
    const terrainOuterMat = terrainMat();
    const terrainMesh = new THREE.Mesh(terrainGeo, [terrainInnerMat, terrainOuterMat]);
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);

    let satelliteReady = false;
    let satImage = null;     // the loaded satellite <img>, kept so road/parking paint can be composited over it
    let envParsed = null;    // parsed OSM areas/roads/paths (set by loadEnvironment)
    function setGroundTexture(tex) {
      terrainInnerMat.map = tex;
      terrainInnerMat.color.set(0xffffff);
      terrainInnerMat.needsUpdate = true;
    }
    function showAttribution() { $("attribution").hidden = false; $("maxarLink").hidden = !satelliteReady; }

    function updateTerrainMesh() {
      const pos = terrainGeo.attributes.position, h = terrain.heights;
      for (let i = 0; i < pos.count; i++) pos.setY(i, TERRAIN_Y + h[i]);
      pos.needsUpdate = true;
      terrainGeo.computeVertexNormals();
      terrainGeo.computeBoundingSphere();
      terrainGeo.computeBoundingBox();
    }

    // ---- elevation data: Mapbox Terrain-RGB tiles, decoded on a canvas ----
    const lngToTileX = (lng, z) => ((lng + 180) / 360) * 2 ** z;
    const latToTileY = (lat, z) => {
      const r = lat * Math.PI / 180;
      return ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * 2 ** z;
    };

    async function fetchTerrainTile(z, x, y) {
      const url = `https://api.mapbox.com/v4/mapbox.terrain-rgb/${z}/${x}/${y}.pngraw?access_token=${MAPBOX_TOKEN}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("terrain tile HTTP " + res.status);
      // decode without any colour management so the RGB values stay exact
      const bmp = await createImageBitmap(await res.blob(), { colorSpaceConversion: "none", premultiplyAlpha: "none" });
      const c = document.createElement("canvas");
      c.width = bmp.width; c.height = bmp.height;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(bmp, 0, 0);
      return { data: ctx.getImageData(0, 0, c.width, c.height).data, size: bmp.width };
    }

    async function loadTerrain() {
      if (!HAS_TOKEN) { console.warn("No MAPBOX_TOKEN - terrain stays flat."); return; }
      const H = TERRAIN_HALF;
      const lat0 = centerLat - H / M_PER_DEG_LAT, lat1 = centerLat + H / M_PER_DEG_LAT;
      const lng0 = centerLng - H / M_PER_DEG_LNG, lng1 = centerLng + H / M_PER_DEG_LNG;

      // highest zoom (max 15) that needs at most 12 tiles
      let z = 15, x0, x1, y0, y1;
      for (; z >= 6; z--) {
        x0 = Math.floor(lngToTileX(lng0, z)); x1 = Math.floor(lngToTileX(lng1, z));
        y0 = Math.floor(latToTileY(lat1, z)); y1 = Math.floor(latToTileY(lat0, z));
        if ((x1 - x0 + 1) * (y1 - y0 + 1) <= 12) break;
      }
      const nx = x1 - x0 + 1, ny = y1 - y0 + 1;
      const jobs = [];
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) jobs.push(fetchTerrainTile(z, tx, ty).then((t) => ({ t, tx, ty })));
      const tiles = await Promise.all(jobs);

      // stitch into one elevation grid (metres above sea level)
      const ts = tiles[0].t.size, MW = nx * ts, MH = ny * ts;
      const elev = new Float32Array(MW * MH);
      for (const { t, tx, ty } of tiles) {
        for (let py = 0; py < ts; py++) {
          for (let px = 0; px < ts; px++) {
            const k = (py * ts + px) * 4;
            elev[((ty - y0) * ts + py) * MW + (tx - x0) * ts + px] =
              -10000 + (t.data[k] * 65536 + t.data[k + 1] * 256 + t.data[k + 2]) * 0.1;
          }
        }
      }
      const sample = (lng, lat) => {   // bilinear
        const fx = Math.min(Math.max((lngToTileX(lng, z) - x0) * ts - 0.5, 0), MW - 1.001);
        const fy = Math.min(Math.max((latToTileY(lat, z) - y0) * ts - 0.5, 0), MH - 1.001);
        const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
        const a = elev[iy * MW + ix], b = elev[iy * MW + ix + 1], c = elev[(iy + 1) * MW + ix], d = elev[(iy + 1) * MW + ix + 1];
        return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
      };

      const N = TERRAIN_N, W = N + 1, raw = new Float32Array(W * W);
      let minE = Infinity;
      for (let iz = 0; iz < W; iz++) {
        for (let ix = 0; ix < W; ix++) {
          const x = -H + ix * TERRAIN_SEG, zz = -H + iz * TERRAIN_SEG;
          const e = sample(centerLng + x / M_PER_DEG_LNG, centerLat - zz / M_PER_DEG_LAT);
          raw[iz * W + ix] = e;
          if (e < minE) minE = e;
        }
      }
      // heights relative to the lowest point (never dips under the fallback ground), faded to 0 beyond 1.5r
      let maxH = 0;
      for (let iz = 0; iz < W; iz++) {
        for (let ix = 0; ix < W; ix++) {
          const x = -H + ix * TERRAIN_SEG, zz = -H + iz * TERRAIN_SEG;
          const d = Math.max(Math.abs(x), Math.abs(zz)) / radiusMeters;
          const t = Math.min(Math.max((2 - d) / 0.5, 0), 1);
          const fade = t * t * (3 - 2 * t);
          const hgt = (raw[iz * W + ix] - minE) * fade;
          terrain.heights[iz * W + ix] = hgt;
          if (hgt > maxH) maxH = hgt;
        }
      }
      terrain.ready = true;
      terrain.relief = maxH;
      console.log(`Terrain loaded (zoom ${z}, ${tiles.length} tiles, relief ${maxH.toFixed(1)} m)`);
      showAttribution();
      updateTerrainMesh();
      onTerrainReady();
    }

    // Everything that depends on ground height gets rebuilt when the heights arrive.
    function onTerrainReady() {
      terrainStamp++;
      rebuildBuildings();
      rebuildPlacements();
      buildEnvironment3D();
      updateHighlight();
      const g = elevationAt(camera.position.x, camera.position.z) + 3;
      if (camera.position.y < g) camera.position.y = g + 7;   // don't start inside a hill
    }

    // =====================================================================
    // 3b. Satellite imagery (Mapbox Static Images API) for the ground and building roofs.
    //     Loaded asynchronously; until it arrives (or if it fails) the OSM-painted ground and
    //     vertex-coloured roofs stay exactly as they were.
    // =====================================================================
    const SAT_MODE = new URLSearchParams(location.search).get("sat");   // ?sat=0 off, ?sat=roofs also puts the photo on roofs
    const USE_SATELLITE = SAT_MODE !== "0";     // satellite photo on the ground (roads/parking painted over it)
    const SAT_ROOFS = SAT_MODE === "roofs";     // roofs stay flat colour unless asked for

    // [minLon, minLat, maxLon, maxLat] of the square (2*radius on a side) around the picked centre
    function satelliteBBox() {
      const dLat = radiusMeters / M_PER_DEG_LAT;
      const dLng = radiusMeters / M_PER_DEG_LNG;
      return [centerLng - dLng, centerLat - dLat, centerLng + dLng, centerLat + dLat];
    }

    function loadSatellite() {
      if (!USE_SATELLITE) return;
      if (!HAS_TOKEN) { console.warn("No MAPBOX_TOKEN (is config.js present?) - keeping flat ground and roofs."); return; }
      const bbox = satelliteBBox().map((n) => n.toFixed(6)).join(",");
      // logo/attribution off so the watermark isn't baked into the ground/roof texture;
      // the credit is shown in the #attribution element instead.
      const url = `https://api.mapbox.com/styles/v1/mapbox/satellite-v9/static/[${bbox}]/1280x1280@2x` +
                  `?access_token=${MAPBOX_TOKEN}&logo=false&attribution=false`;

      new THREE.TextureLoader().load(
        url,
        (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          // default flipY = true, wrap = clamp: image top (north) is v = 1, left (west) is u = 0
          satelliteReady = true;
          satImage = tex.image;
          setGroundTexture(tex);        // drapes over the terrain's middle square
          if (envParsed) paintGroundTexture();   // OSM already here: repaint roads/parking over the photo (hides cars)
          if (SAT_ROOFS) {
            roofMat.map = tex;            // roof UVs are already world-projected in rebuildBuildings()
            roofMat.vertexColors = false; // otherwise the imagery is multiplied by the flat roof colour
            roofMat.needsUpdate = true;
          }
          showAttribution();
          console.log("Satellite imagery loaded");
        },
        undefined,
        (err) => console.warn("Satellite imagery failed to load (bad token / offline / rate limit?) - keeping flat colours.", err)
      );
    }

    // =====================================================================
    // 5. Buildings
    //    Every building (OSM or custom) is a record in `buildings`. The visible meshes are
    //    re-merged from those records whenever something changes, and each merged triangle
    //    remembers which building owns it so the crosshair can pick individual buildings.
    //    Record: { id, footprint[(x east, y north)], height (to the eaves), minHeight,
    //              wallColor, roofColor (hex), glass, roof: null | { shape, h? } }
    // =====================================================================
    const MATERIAL_COLORS = {
      brick: 0xb0654d, concrete: 0xbdbdb5, stone: 0xc9bfa8, wood: 0xa67b50,
      metal: 0xb5bcc4, glass: 0xcfe3ee, plaster: 0xe6dccb, cement_block: 0xb8b8b0
    };
    const TYPE_COLORS = {
      house: 0xe8c39e, detached: 0xe8c39e, terrace: 0xd9a98a, residential: 0xdcdccb,
      apartments: 0xc9d6df, commercial: 0xb5c9d9, office: 0xb5c9d9, retail: 0xd9c9b5,
      industrial: 0xaaaaaa, school: 0xf0e0a0, university: 0xd8c6a5, church: 0xd0b0a0,
      garage: 0xbdbdbd, garages: 0xbdbdbd, yes: 0xd6d6d6
    };

    function getWallColor(tags, height) {
      if (tags["building:colour"]) return new THREE.Color(tags["building:colour"]);
      const mat = tags["building:material"];
      if (mat && MATERIAL_COLORS[mat]) return new THREE.Color(MATERIAL_COLORS[mat]);
      if (tags.building && TYPE_COLORS[tags.building]) return new THREE.Color(TYPE_COLORS[tags.building]);
      const t = Math.min(height / 60, 1);
      return new THREE.Color().setHSL(0.58, 0.12, 0.78 - t * 0.18);
    }

    function getRoofColor(tags) {
      if (tags["roof:colour"]) return new THREE.Color(tags["roof:colour"]);
      const houseLike = ["house", "detached", "terrace", "residential", "semidetached_house"];
      return new THREE.Color(houseLike.includes(tags.building) ? 0x8a5a4b : 0x8b8f93);
    }

    function isGlassBuilding(tags, height) {
      return tags["building:material"] === "glass" ||
             tags["building:cladding"] === "glass" ||
             height >= 30 ||
             (tags.building === "office" && height >= 12);
    }

    // Copy one material group of an ExtrudeGeometry into its own geometry, with a vertex colour
    function sliceGeometry(geo, start, count, color) {
      const g = new THREE.BufferGeometry();
      for (const name of ["position", "normal", "uv"]) {
        const attr = geo.attributes[name];
        g.setAttribute(name, new THREE.BufferAttribute(
          attr.array.slice(start * attr.itemSize, (start + count) * attr.itemSize), attr.itemSize));
      }
      const colors = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        colors[i * 3] = color.r; colors[i * 3 + 1] = color.g; colors[i * 3 + 2] = color.b;
      }
      g.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      return g;
    }

    // ExtrudeGeometry's UVs are footprint-local, so a shared satellite texture would look random on roofs.
    // Re-derive them from WORLD position so every roof samples the same image as the ground under it.
    // Positions are already world-space here (x = east, z = -north, origin = picked centre).
    // With the default flipY texture, v = 1 is the image top = north = -z, hence (r - z), not (z + r).
    function projectRoofUVs(geo) {
      const pos = geo.attributes.position, uv = geo.attributes.uv;
      const size = radiusMeters * 2;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) + radiusMeters) / size, (radiusMeters - pos.getZ(i)) / size);
      }
      uv.needsUpdate = true;
    }

    // Prism from a footprint ring (x, north): `depth` tall, its bottom at world height `y`.
    function extrudeRing(ring, depth, y) {
      const shape = new THREE.Shape();
      ring.forEach(([x, n], i) => (i ? shape.lineTo(x, n) : shape.moveTo(x, n)));
      const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(depth, 0.1), bevelEnabled: false });
      geo.rotateX(-Math.PI / 2);   // shape XY plane -> ground plane, extrusion -> up
      geo.translate(0, y, 0);
      return geo;
    }

    // Lowest ground height under a footprint (world ring [x, z]), so buildings never float on slopes
    function terrainBase(ringW) {
      let lo = Infinity, cx = 0, cz = 0;
      for (const [x, z] of ringW) { lo = Math.min(lo, elevationAt(x, z)); cx += x; cz += z; }
      return Math.min(lo, elevationAt(cx / ringW.length, cz / ringW.length));
    }

    // ---- flat-shaded triangle soup builder (position/normal/uv/colour, non-indexed like ExtrudeGeometry) ----
    class MeshBuilder {
      constructor() { this.pos = []; this.nor = []; this.uv = []; this.col = []; this.cur = [1, 1, 1]; }
      setColor(c) { this.cur = [c.r, c.g, c.b]; }
      tri(a, b, c, { up = false, wall = false, dir = null } = {}) {
        const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
        const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        const len = Math.hypot(nx, ny, nz);
        if (len < 1e-6) return;                 // degenerate (e.g. a hip roof on a square)
        nx /= len; ny /= len; nz /= len;
        if (up && ny < 0) { const t = b; b = c; c = t; nx = -nx; ny = -ny; nz = -nz; }   // roof faces up
        if (dir && nx * dir[0] + ny * dir[1] + nz * dir[2] < 0) { const t = b; b = c; c = t; nx = -nx; ny = -ny; nz = -nz; }   // face the given way
        let dx = b[0] - a[0], dz = b[2] - a[2], dl = Math.hypot(dx, dz);
        if (dl < 1e-6) { dx = c[0] - a[0]; dz = c[2] - a[2]; dl = Math.hypot(dx, dz) || 1; }
        dx /= dl; dz /= dl;
        for (const p of [a, b, c]) {
          this.pos.push(p[0], p[1], p[2]);
          this.nor.push(nx, ny, nz);
          this.col.push(this.cur[0], this.cur[1], this.cur[2]);
          if (wall) this.uv.push((p[0] - a[0]) * dx + (p[2] - a[2]) * dz, 1 - (p[1] - a[1]));   // metres, like wall UVs
          else this.uv.push(0, 0);              // roofs get world-projected UVs afterwards
        }
      }
      quad(a, b, c, d, opts) { this.tri(a, b, c, opts); this.tri(a, c, d, opts); }
      toGeometry(color) {   // with a colour: one flat colour; without: the per-vertex colours set via setColor()
        if (!this.pos.length) return null;
        const g = new THREE.BufferGeometry();
        const n = this.pos.length / 3, col = color ? new Float32Array(n * 3) : new Float32Array(this.col);
        if (color) for (let i = 0; i < n; i++) { col[i * 3] = color.r; col[i * 3 + 1] = color.g; col[i * 3 + 2] = color.b; }
        g.setAttribute("position", new THREE.Float32BufferAttribute(this.pos, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(this.nor, 3));
        g.setAttribute("uv", new THREE.Float32BufferAttribute(this.uv, 2));
        g.setAttribute("color", new THREE.BufferAttribute(col, 3));
        return g;
      }
    }

    // Storeys to assume when OSM has no building:levels / height (was a flat 3 for everything)
    const DEFAULT_LEVELS = {
      house: 2, detached: 2, semidetached_house: 2, terrace: 2, residential: 2,
      bungalow: 1, cabin: 1, hut: 1, shed: 1, garage: 1, garages: 1, carport: 1, roof: 1, service: 1, static_caravan: 1
    };

    // ---- roof selection ----
    const ROOF_SHAPES = {
      gabled: "gabled", gable: "gabled", gambrel: "gabled", saltbox: "gabled", round: "gabled",
      hipped: "hipped", hip: "hipped", "half-hipped": "hipped", mansard: "hipped",
      pyramidal: "pyramidal", dome: "pyramidal", cone: "pyramidal", onion: "pyramidal",
      skillion: "skillion", lean_to: "skillion", shed: "skillion"
    };
    const HOUSE_TYPES = new Set(["house", "detached", "semidetached_house", "terrace", "residential", "bungalow",
      "cabin", "hut", "shed", "garage", "garages", "carport", "farm", "static_caravan", "chapel", "church"]);

    // Can we build a pitched roof on this footprint? (a near-rectangle, or any convex polygon)
    function roofEligible(ringW) {
      const box = orientedBox(ringW);
      return polyArea(ringW) / Math.max(box.L * box.W, 1e-6) >= 0.85 || isConvex(ringW);
    }

    function defaultRoofHeight(shape, box) {
      const tan30 = Math.tan(Math.PI / 6);
      let h;
      if (shape === "skillion") h = box.W * Math.tan(12 * Math.PI / 180);
      else if (shape === "pyramidal") h = (Math.min(box.L, box.W) / 2) * tan30;
      else h = (box.W / 2) * tan30;
      return Math.min(Math.max(h, 1), 8);
    }

    // OSM roof:shape if present; otherwise guess: small houses/sheds get pitched roofs, everything else stays flat
    function pickRoof(tags, ring, wallHeight) {
      const ringW = ring.map(([x, n]) => [x, -n]);
      const tagged = (tags["roof:shape"] || "").toLowerCase();
      if (tagged === "flat") return null;
      let shape = ROOF_SHAPES[tagged];
      if (!shape) {
        if (tagged) return null;   // some exotic shape we don't model -> flat
        const area = polyArea(ringW), t = tags.building;
        const small = wallHeight <= 12 &&
          ((HOUSE_TYPES.has(t) && area <= 500) || (t === "yes" && area <= 160 && wallHeight <= 7));
        if (!small) return null;
        const box = orientedBox(ringW);
        shape = box.L / Math.max(box.W, 0.1) < 1.3 ? "hipped" : "gabled";
      }
      if (!roofEligible(ringW)) return null;
      const lv = num(tags["roof:levels"], NaN);
      return { shape, h: num(tags["roof:height"], Number.isFinite(lv) ? lv * 3 : undefined) };
    }

    // Roof + gable-end triangles for a pitched roof. Works in world coordinates.
    // Rectangular-ish footprints use their oriented box; other convex footprints get a pyramid from the centroid.
    function buildRoofGeometry(ringW, eaveY, roof, roofColor, wallColor) {
      const box = orientedBox(ringW);
      const rectLike = polyArea(ringW) / Math.max(box.L * box.W, 1e-6) >= 0.85;
      const rb = new MeshBuilder(), gb = new MeshBuilder();

      if (!rectLike) {
        if (!isConvex(ringW)) return null;
        const h = roof.h ?? defaultRoofHeight("pyramidal", box);
        const cx = ringW.reduce((s, p) => s + p[0], 0) / ringW.length;
        const cz = ringW.reduce((s, p) => s + p[1], 0) / ringW.length;
        const apex = [cx, eaveY + h, cz];
        for (let i = 0; i < ringW.length; i++) {
          const p = ringW[i], q = ringW[(i + 1) % ringW.length];
          rb.tri([p[0], eaveY, p[1]], [q[0], eaveY, q[1]], apex, { up: true });
        }
      } else {
        const shape = roof.shape;
        const h = roof.h ?? defaultRoofHeight(shape, box);
        const hl = box.L / 2, hw = box.W / 2, y0 = eaveY, y1 = eaveY + h;
        const P = (u, v, y) => [box.cx + u * box.c - v * box.s, y, box.cy + u * box.s + v * box.c];
        const A = P(-hl, -hw, y0), B = P(hl, -hw, y0), C = P(hl, hw, y0), D = P(-hl, hw, y0);
        const up = { up: true }, wall = { wall: true };
        if (shape === "gabled") {
          const R1 = P(-hl, 0, y1), R2 = P(hl, 0, y1);
          rb.quad(A, B, R2, R1, up); rb.quad(C, D, R1, R2, up);
          gb.tri(A, D, R1, wall); gb.tri(B, C, R2, wall);          // the two triangular gable walls
        } else if (shape === "hipped") {
          const ri = Math.max(hl - hw, 0);                          // ridge shrinks to a point on a square
          const R1 = P(-ri, 0, y1), R2 = P(ri, 0, y1);
          rb.quad(A, B, R2, R1, up); rb.quad(C, D, R1, R2, up);
          rb.tri(D, A, R1, up); rb.tri(B, C, R2, up);
        } else if (shape === "pyramidal") {
          const apex = P(0, 0, y1);
          rb.tri(A, B, apex, up); rb.tri(B, C, apex, up); rb.tri(C, D, apex, up); rb.tri(D, A, apex, up);
        } else {   // skillion: low along v = -hw, high along v = +hw
          const Ch = P(hl, hw, y1), Dh = P(-hl, hw, y1);
          rb.quad(A, B, Ch, Dh, up);
          gb.tri(A, D, Dh, wall); gb.tri(B, C, Ch, wall);          // side triangles
          gb.quad(D, C, Ch, Dh, wall);                             // the tall back wall
        }
      }
      return { roof: rb.toGeometry(roofColor), gables: gb.toGeometry(wallColor) };
    }

    // ---- flat-roof parapet: a thin raised rim just inside the wall line ----
    function insetRing(ring, d) {
      const n = ring.length, ccw = signedArea(ring) > 0, out = [];
      for (let i = 0; i < n; i++) {
        const p = ring[(i - 1 + n) % n], c = ring[i], q = ring[(i + 1) % n];
        const e1x = c[0] - p[0], e1y = c[1] - p[1], e2x = q[0] - c[0], e2y = q[1] - c[1];
        const l1 = Math.hypot(e1x, e1y), l2 = Math.hypot(e2x, e2y);
        if (l1 < 1 || l2 < 1) return null;       // tiny edges make the offset unreliable
        const s = ccw ? 1 : -1;                   // inward normal
        const n1 = [-e1y / l1 * s, e1x / l1 * s], n2 = [-e2y / l2 * s, e2x / l2 * s];
        const dot = n1[0] * n2[0] + n1[1] * n2[1];
        if (1 + dot < 0.3) return null;           // corner too sharp
        const k = d / (1 + dot);
        out.push([c[0] + (n1[0] + n2[0]) * k, c[1] + (n1[1] + n2[1]) * k]);
      }
      const ratio = polyArea(out) / polyArea(ring);
      if (ratio < 0.4 || ratio >= 1) return null;
      if (!out.every(([x, y]) => pointInRing(x, y, ring))) return null;
      return out;
    }

    const PARAPET_H = 0.6, PARAPET_W = 0.35, SKIRT = 0.6;

    function parapetGeometry(ring, eaveY, color) {
      const inner = insetRing(ring, PARAPET_W);
      if (!inner) return null;
      const shape = new THREE.Shape();
      ring.forEach(([x, n], i) => (i ? shape.lineTo(x, n) : shape.moveTo(x, n)));
      const hole = new THREE.Path();
      inner.forEach(([x, n], i) => (i ? hole.lineTo(x, n) : hole.moveTo(x, n)));
      shape.holes.push(hole);
      const geo = new THREE.ExtrudeGeometry(shape, { depth: PARAPET_H, bevelEnabled: false });
      geo.rotateX(-Math.PI / 2);
      geo.translate(0, eaveY, 0);
      const out = sliceGeometry(geo, 0, geo.attributes.position.count, color);
      geo.dispose();
      return out;
    }

    // Everything one building contributes: wall pieces, roof pieces and (tier >= 1) window/detail geometry.
    // All world-space and vertex-coloured. `ctx` = { tier, neighbors }.
    function buildingParts(b, ctx = { tier: 0, neighbors: null }) {
      const ring = cleanRing(b.footprint);
      if (ring.length < 3) return null;
      const ringW = ring.map(([x, n]) => [x, -n]);
      const base = terrainBase(ringW);
      const minH = b.minHeight || 0;
      const bottom = base + minH - (minH === 0 ? SKIRT : 0);   // sink the walls so slopes never show a gap
      const eaveY = base + b.height;
      const wallColor = new THREE.Color(b.wallColor), roofColor = new THREE.Color(b.roofColor);
      // glass buildings: with real glazing in front, the wall itself is the dark spandrel between the windows
      const shellColor = b.glass && ctx.tier >= 1 ? wallColor.clone().multiplyScalar(0.5) : wallColor;
      const out = { walls: [], roofs: [], glass: !!b.glass, detail: null, windows: null };

      const ext = extrudeRing(ring, eaveY - bottom, bottom);
      for (const g of ext.groups) if (g.materialIndex === 1) out.walls.push(sliceGeometry(ext, g.start, g.count, shellColor));

      let pitched = null;
      if (b.roof && b.roof.shape && b.roof.shape !== "flat") pitched = buildRoofGeometry(ringW, eaveY, b.roof, roofColor, shellColor);

      if (pitched && pitched.roof) {
        out.roofs.push(pitched.roof);
        if (pitched.gables) out.walls.push(pitched.gables);
      } else {
        // flat roof = top lid of the extrusion (the caps group is bottom faces first, then top faces)
        const caps = ext.groups.find((g) => g.materialIndex === 0);
        const half = caps.count / 2;
        out.roofs.push(sliceGeometry(ext, caps.start + half, half, roofColor));
        if (b.height >= 5 && !b.glass && polyArea(ring) >= 80) {
          const rim = parapetGeometry(ring, eaveY, wallColor.clone().multiplyScalar(0.92));
          if (rim) out.walls.push(rim);
        }
      }
      ext.dispose();

      if (ctx.tier >= 1 && ctx.neighbors) {
        const d = buildDetail(b, { ringW, base, eaveY, wallColor, roofColor, tier: ctx.tier, neighbors: ctx.neighbors });
        out.detail = d.detail; out.windows = d.windows;
      }
      return out;
    }

    // =====================================================================
    // 5b. Building detail - all real geometry, no textures: windows (frames, reveals, sills, lintels),
    //     doors + steps + canopies, base bands, cornices, string courses, corner posts, balconies, shop awnings,
    //     chimneys, rooftop units, stair bulkheads and antennas.
    //     Detail is built per building and cached. How much a building gets (its "tier") comes from a
    //     triangle budget, nearest buildings first:  2 = everything,  1 = glass + sills only,  0 = none.
    //     ?detail=low|high|off in the URL scales the budget.
    // =====================================================================
    const DETAIL_PARAM = (new URLSearchParams(location.search).get("detail") || "").toLowerCase();
    // Default is now "light": the nearest ~1/6 of the old budget gets windows/doors/trim, the rest stays plain.
    //   ?detail=off (none) | low (tiny) | (default) | high (the previous default) | max
    const DETAIL_BUDGET = 800000 * ({ off: 0, low: 0.06, high: 1, max: 2.5 }[DETAIL_PARAM] ?? 0.16);

    const hash01 = (id, salt = 0) => {
      let h = (2166136261 ^ Math.imul(salt + 1, 16777619)) >>> 0;
      const s = String(id);
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995) >>> 0; h ^= h >>> 15;
      return (h >>> 0) / 4294967296;
    };

    const NO_WINDOW_KINDS = new Set(["industrial", "warehouse", "garage", "garages", "carport", "roof", "service", "shed",
      "hut", "static_caravan", "greenhouse", "storage_tank", "barn", "transformer_tower", "kiosk"]);
    const GARAGE_KINDS = new Set(["garage", "garages", "carport"]);
    const RETAIL_KINDS = new Set(["retail", "commercial", "supermarket"]);
    const APARTMENT_KINDS = new Set(["apartments", "dormitory", "residential"]);
    const BIG_ENTRANCE_KINDS = new Set(["retail", "commercial", "supermarket", "office", "school", "university", "college",
      "hospital", "civic", "public", "government", "hotel", "church", "cathedral", "apartments", "dormitory"]);
    const AWNING_COLORS = [0x9b2d30, 0x2f5d50, 0x27406b, 0xb58a3b, 0x5a3d6b, 0x3b3b3b];
    const DOOR_COLORS = [0x5a3a2a, 0x2f4a3a, 0x3a3f57, 0x7a2a2a, 0x2b2b2b, 0x6b5a2a];

    const _white = new THREE.Color(0xffffff);
    const tint = (c, k) => (k >= 1 ? c.clone().lerp(_white, Math.min(k - 1, 1)) : c.clone().multiplyScalar(k));

    // Outward-facing edge frame: origin a, unit tangent t, outward normal n (CCW ring in the (x, z) plane -> n = (tz, -tx))
    function edgeFrame(a, b, sign) {
      const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz) || 1e-6;
      const tx = dx / len, tz = dz / len;
      return { ax: a[0], az: a[1], len, tx, tz, nx: tz * sign, nz: -tx * sign };
    }
    const EP = (f, s, off, y) => [f.ax + f.tx * s + f.nx * off, y, f.az + f.tz * s + f.nz * off];
    // vertical rectangle on the wall plane (offset `off` outward), facing outward
    const fq = (mb, f, s0, s1, off, y0, y1) =>
      mb.quad(EP(f, s0, off, y0), EP(f, s1, off, y0), EP(f, s1, off, y1), EP(f, s0, off, y1), { dir: [f.nx, 0, f.nz] });
    // a box stuck to the wall: front + top (+ bottom) + both ends
    function fbox(mb, f, s0, s1, o0, o1, y0, y1, bottom = false) {
      const n = [f.nx, 0, f.nz], t = [f.tx, 0, f.tz], mt = [-f.tx, 0, -f.tz];
      mb.quad(EP(f, s0, o1, y0), EP(f, s1, o1, y0), EP(f, s1, o1, y1), EP(f, s0, o1, y1), { dir: n });
      mb.quad(EP(f, s0, o0, y1), EP(f, s0, o1, y1), EP(f, s1, o1, y1), EP(f, s1, o0, y1), { dir: [0, 1, 0] });
      mb.quad(EP(f, s0, o0, y0), EP(f, s0, o1, y0), EP(f, s0, o1, y1), EP(f, s0, o0, y1), { dir: mt });
      mb.quad(EP(f, s1, o0, y0), EP(f, s1, o1, y0), EP(f, s1, o1, y1), EP(f, s1, o0, y1), { dir: t });
      if (bottom) mb.quad(EP(f, s0, o0, y0), EP(f, s1, o0, y0), EP(f, s1, o1, y0), EP(f, s0, o1, y0), { dir: [0, -1, 0] });
    }
    // free-standing box (4 sides + top [+ bottom]) centred at (cx, cz), axis u = (ux, uz)
    function abox(mb, cx, cz, ux, uz, hx, hz, y0, y1, bottom = false) {
      const vx = -uz, vz = ux;
      const C = (a, b, y) => [cx + ux * a * hx + vx * b * hz, y, cz + uz * a * hx + vz * b * hz];
      mb.quad(C(1, -1, y0), C(1, 1, y0), C(1, 1, y1), C(1, -1, y1), { dir: [ux, 0, uz] });
      mb.quad(C(-1, 1, y0), C(-1, -1, y0), C(-1, -1, y1), C(-1, 1, y1), { dir: [-ux, 0, -uz] });
      mb.quad(C(1, 1, y0), C(-1, 1, y0), C(-1, 1, y1), C(1, 1, y1), { dir: [vx, 0, vz] });
      mb.quad(C(-1, -1, y0), C(1, -1, y0), C(1, -1, y1), C(-1, -1, y1), { dir: [-vx, 0, -vz] });
      mb.quad(C(-1, -1, y1), C(1, -1, y1), C(1, 1, y1), C(-1, 1, y1), { dir: [0, 1, 0] });
      if (bottom) mb.quad(C(-1, -1, y0), C(1, -1, y0), C(1, 1, y0), C(-1, 1, y0), { dir: [0, -1, 0] });
    }

    // A punched window: glass, frame ring, inner reveal, mullion/transom, sill, lintel.
    function addWindow(D, f, s, y0, w, h, tier, palette) {
      const s0 = s - w / 2, s1 = s + w / 2, y1 = y0 + h;
      D.glass.setColor(palette.glass);
      fq(D.glass, f, s0, s1, 0.05, y0, y1);
      const T = D.detail;
      if (tier < 2) {   // light: just a sill under the glass
        T.setColor(palette.trim);
        fbox(T, f, s0 - 0.05, s1 + 0.05, 0, 0.1, y0 - 0.07, y0);
        return;
      }
      const ft = 0.07, off = 0.11, t = [f.tx, 0, f.tz], mt = [-f.tx, 0, -f.tz];
      T.setColor(palette.frame);
      fq(T, f, s0 - ft, s1 + ft, off, y0 - ft, y0);
      fq(T, f, s0 - ft, s1 + ft, off, y1, y1 + ft);
      fq(T, f, s0 - ft, s0, off, y0, y1);
      fq(T, f, s1, s1 + ft, off, y0, y1);
      // reveal: the four inner faces between the glass plane and the frame face
      T.quad(EP(f, s0, 0.05, y0), EP(f, s0, off, y0), EP(f, s0, off, y1), EP(f, s0, 0.05, y1), { dir: t });
      T.quad(EP(f, s1, 0.05, y0), EP(f, s1, off, y0), EP(f, s1, off, y1), EP(f, s1, 0.05, y1), { dir: mt });
      T.quad(EP(f, s0, 0.05, y0), EP(f, s1, 0.05, y0), EP(f, s1, off, y0), EP(f, s0, off, y0), { dir: [0, 1, 0] });
      T.quad(EP(f, s0, 0.05, y1), EP(f, s1, 0.05, y1), EP(f, s1, off, y1), EP(f, s0, off, y1), { dir: [0, -1, 0] });
      if (w >= 1.3) fq(T, f, s - 0.03, s + 0.03, off + 0.005, y0, y1);
      if (h >= 1.4) fq(T, f, s0, s1, off + 0.005, y0 + h * 0.62 - 0.03, y0 + h * 0.62 + 0.03);
      T.setColor(palette.trim);
      fbox(T, f, s0 - 0.1, s1 + 0.1, 0, 0.17, y0 - 0.1, y0 - ft, true);            // sill
      fbox(T, f, s0 - 0.07, s1 + 0.07, 0, 0.09, y1 + ft, y1 + ft + 0.1);            // lintel
    }

    // Spatial index of footprints, used to skip windows on walls shared with a neighbouring building.
    function makeNeighborIndex(items) {   // items: [{ id, ringW }]
      const CELL = 24, cells = new Map(), key = (i, j) => i * 100003 + j;
      const info = new Map();
      for (const it of items) {
        let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
        for (const [x, z] of it.ringW) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
        const e = { id: it.id, ringW: it.ringW, x0, x1, z0, z1 };
        info.set(it.id, e);
        for (let i = Math.floor(x0 / CELL); i <= Math.floor(x1 / CELL); i++)
          for (let j = Math.floor(z0 / CELL); j <= Math.floor(z1 / CELL); j++) {
            const k = key(i, j);
            if (!cells.has(k)) cells.set(k, []);
            cells.get(k).push(e);
          }
      }
      return {
        covered(x, z, selfId) {
          const list = cells.get(key(Math.floor(x / CELL), Math.floor(z / CELL)));
          if (!list) return false;
          for (const e of list) if (e.id !== selfId && x >= e.x0 && x <= e.x1 && z >= e.z0 && z <= e.z1 && pointInRing(x, z, e.ringW)) return true;
          return false;
        },
        signature(id) {   // ids of buildings whose bounding boxes touch this one (part of the cache key)
          const me = info.get(id);
          if (!me) return "";
          const out = new Set();
          for (let i = Math.floor((me.x0 - 1) / CELL); i <= Math.floor((me.x1 + 1) / CELL); i++)
            for (let j = Math.floor((me.z0 - 1) / CELL); j <= Math.floor((me.z1 + 1) / CELL); j++)
              for (const e of cells.get(key(i, j)) || [])
                if (e.id !== id && e.x1 >= me.x0 - 1 && e.x0 <= me.x1 + 1 && e.z1 >= me.z0 - 1 && e.z0 <= me.z1 + 1) out.add(e.id);
          return [...out].sort().join(",");
        }
      };
    }

    // storeys and per-kind window layout shared by the estimator and the builder
    function detailLayout(b) {
      const kind = b.kind || "yes";
      const minH = b.minHeight || 0;
      const floors = Math.max(1, Math.round((b.height - minH) / 3.1));
      const fh = Math.min(Math.max((b.height - minH) / floors, 2.6), 5);
      const house = HOUSE_TYPES.has(kind) && !APARTMENT_KINDS.has(kind) || kind === "terrace";
      const bay = house ? 3.2 : 3.4;
      return { kind, minH, floors, fh, house, bay, noWindows: NO_WINDOW_KINDS.has(kind) };
    }

    // rough triangle cost, used to hand out tiers under the budget
    function estimateDetail(ringW, b, tier) {
      const L = detailLayout(b);
      let tris = 60, edges = 0;
      for (let i = 0; i < ringW.length; i++) {
        const a = ringW[i], c = ringW[(i + 1) % ringW.length], len = Math.hypot(c[0] - a[0], c[1] - a[1]);
        if (len < 1.5) continue;
        edges++;
        if (L.noWindows) continue;
        const nb = b.glass ? Math.floor(len / 1.5) : Math.max(0, Math.floor((len - 1.8) / L.bay));
        tris += nb * L.floors * (tier === 2 ? (b.glass ? 6 : 32) : (b.glass ? 2 : 6)) + (tier === 2 ? 30 : 0) + L.floors * (b.glass ? 2 : 0);
      }
      return tris + (tier === 2 ? edges * (12 + L.floors * 4) + 250 : 0);
    }

    // Everything one building gets: returns { detail, windows } geometries (world space, vertex-coloured), or nulls.
    function buildDetail(b, c) {
      const { ringW, base, eaveY, wallColor, roofColor, tier, neighbors } = c;
      if (tier < 1) return { detail: null, windows: null };
      const L = detailLayout(b), sign = signedArea(ringW) > 0 ? 1 : -1;
      const id = b.id, n = ringW.length;
      const yBase = base + L.minH;
      const r = (salt) => hash01(id, salt);

      const D = { detail: new MeshBuilder(), glass: new MeshBuilder() };
      const glassCol = new THREE.Color().setHSL(0.57 + r(1) * 0.05, 0.32, 0.26 + r(2) * 0.1);
      const palette = {
        glass: b.glass ? new THREE.Color().setHSL(0.56 + r(1) * 0.04, 0.4, 0.42 + r(2) * 0.1) : glassCol,
        frame: L.house || wallColor.getHSL({ h: 0, s: 0, l: 0 }).l > 0.72 && !b.glass && r(3) < 0.5 ? new THREE.Color(0xf1eee7) : new THREE.Color(0x3c4046),
        trim: tint(wallColor, 1.28)
      };
      const plinth = L.house ? new THREE.Color(0x8d8983) : tint(wallColor, 0.78);
      const T = D.detail;

      // ---- per-edge frames ----
      const edges = [];
      for (let i = 0; i < n; i++) {
        const f = edgeFrame(ringW[i], ringW[(i + 1) % n], sign);
        if (f.len < 1.5) { edges.push(null); continue; }
        const mx = f.ax + f.tx * f.len / 2 + f.nx * 0.6, mz = f.az + f.tz * f.len / 2 + f.nz * 0.6;
        f.covered = neighbors.covered(mx, mz, id);
        edges.push(f);
      }
      // entrance edge = the longest uncovered edge
      let doorEdge = -1, best = 0;
      edges.forEach((f, i) => { if (f && !f.covered && f.len > best && f.len >= 3) { best = f.len; doorEdge = i; } });

      // ---- door (decided first so windows can avoid it) ----
      let door = null;
      if (tier === 2 && doorEdge >= 0 && L.minH === 0 && b.height >= 2.6) {
        const f = edges[doorEdge];
        const big = BIG_ENTRANCE_KINDS.has(L.kind) || polyArea(ringW) > 350 || L.floors >= 3;
        const garage = GARAGE_KINDS.has(L.kind), dock = L.kind === "industrial" || L.kind === "warehouse";
        const w = garage ? 2.6 : dock ? 3.2 : big ? 2.4 : 1.0;
        const h = garage ? 2.2 : dock ? 3.0 : big ? 2.5 : 2.05;
        const s = Math.min(Math.max(L.house && !garage ? f.len * 0.3 : f.len * 0.5, w / 2 + 0.7), f.len - w / 2 - 0.7);
        const gx = f.ax + f.tx * s + f.nx * 0.05, gz = f.az + f.tz * s + f.nz * 0.05;
        const y0 = Math.max(elevationAt(gx, gz), base - 0.2);
        if (s > w / 2 + 0.3 && y0 + h < eaveY - 0.3) {
          door = { edge: doorEdge, s0: s - w / 2 - 0.6, s1: s + w / 2 + 0.6 };
          const doorCol = new THREE.Color(DOOR_COLORS[Math.floor(r(4) * DOOR_COLORS.length)]);
          if (big && !garage && !dock) {   // glass double door
            D.glass.setColor(palette.glass);
            fq(D.glass, f, s - w / 2, s + w / 2, 0.05, y0, y0 + h);
            T.setColor(palette.frame);
            fq(T, f, s - w / 2 - 0.1, s - w / 2, 0.09, y0, y0 + h + 0.1);
            fq(T, f, s + w / 2, s + w / 2 + 0.1, 0.09, y0, y0 + h + 0.1);
            fq(T, f, s - w / 2, s + w / 2, 0.09, y0 + h, y0 + h + 0.1);
            fq(T, f, s - 0.04, s + 0.04, 0.09, y0, y0 + h);
            fq(T, f, s - w / 2, s + w / 2, 0.09, y0 + h * 0.45, y0 + h * 0.45 + 0.05);   // push bar
            // canopy on two posts
            const awn = new THREE.Color(AWNING_COLORS[Math.floor(r(5) * AWNING_COLORS.length)]);
            T.setColor(tint(awn, 0.9));
            fbox(T, f, s - w / 2 - 0.5, s + w / 2 + 0.5, 0, 1.5, y0 + h + 0.3, y0 + h + 0.42, true);
            T.setColor(new THREE.Color(0x55595e));
            for (const sx of [-1, 1]) {
              const px = f.ax + f.tx * (s + sx * (w / 2 + 0.4)) + f.nx * 1.35, pz = f.az + f.tz * (s + sx * (w / 2 + 0.4)) + f.nz * 1.35;
              abox(T, px, pz, f.tx, f.tz, 0.05, 0.05, y0, y0 + h + 0.3);
            }
            // steps
            T.setColor(new THREE.Color(0xa7a49d));
            fbox(T, f, s - w / 2 - 0.5, s + w / 2 + 0.5, 0, 0.9, y0 - 0.02, y0 + 0.14);
            fbox(T, f, s - w / 2 - 0.9, s + w / 2 + 0.9, 0, 1.4, y0 - 0.02, y0 + 0.07);
          } else {
            T.setColor(doorCol);
            fq(T, f, s - w / 2, s + w / 2, 0.06, y0, y0 + h);
            if (garage || dock) {   // roll-up door panel lines
              T.setColor(tint(doorCol, 1.15));
              for (let k = 1; k <= 5; k++) fq(T, f, s - w / 2, s + w / 2, 0.075, y0 + (h * k) / 6 - 0.02, y0 + (h * k) / 6 + 0.02);
            } else {
              T.setColor(new THREE.Color(0xd9b45a));
              fq(T, f, s + w / 2 - 0.2, s + w / 2 - 0.13, 0.08, y0 + 0.95, y0 + 1.05);   // handle
            }
            T.setColor(palette.trim);
            fq(T, f, s - w / 2 - 0.09, s - w / 2, 0.09, y0, y0 + h + 0.09);
            fq(T, f, s + w / 2, s + w / 2 + 0.09, 0.09, y0, y0 + h + 0.09);
            fq(T, f, s - w / 2 - 0.09, s + w / 2 + 0.09, 0.09, y0 + h, y0 + h + 0.09);
            if (!garage && !dock) {
              T.setColor(new THREE.Color(0xa7a49d));
              fbox(T, f, s - w / 2 - 0.3, s + w / 2 + 0.3, 0, 0.55, y0 - 0.02, y0 + 0.15);
              fbox(T, f, s - w / 2 - 0.3, s + w / 2 + 0.3, 0.55, 0.95, y0 - 0.02, y0 + 0.08);
              if (L.kind === "terrace" || L.kind === "apartments") {   // small hood over the door
                T.setColor(tint(wallColor, 0.7));
                fbox(T, f, s - w / 2 - 0.4, s + w / 2 + 0.4, 0, 1.0, y0 + h + 0.2, y0 + h + 0.3, true);
              }
            }
          }
          // shop awning across the front of retail buildings
          if (RETAIL_KINDS.has(L.kind) && f.len >= 6) {
            const awn = new THREE.Color(AWNING_COLORS[Math.floor(r(6) * AWNING_COLORS.length)]);
            T.setColor(awn);
            const a0 = 0.6, a1 = f.len - 0.6, ya = y0 + 2.9;
            T.quad(EP(f, a0, 0, ya + 0.2), EP(f, a1, 0, ya + 0.2), EP(f, a1, 1.0, ya - 0.1), EP(f, a0, 1.0, ya - 0.1), { dir: [f.nx * 0.5, 0.85, f.nz * 0.5] });
            T.tri(EP(f, a0, 0, ya + 0.2), EP(f, a0, 1.0, ya - 0.1), EP(f, a0, 0, ya - 0.1), { dir: [-f.tx, 0, -f.tz] });
            T.tri(EP(f, a1, 0, ya + 0.2), EP(f, a1, 0, ya - 0.1), EP(f, a1, 1.0, ya - 0.1), { dir: [f.tx, 0, f.tz] });
            fq(T, f, a0, a1, 1.0, ya - 0.2, ya - 0.1);   // valance
          }
        }
      }

      // ---- walls: bands, windows, ribbons ----
      const balconies = [];
      edges.forEach((f, ei) => {
        if (!f || f.covered) return;
        const wallTop = eaveY;
        if (L.minH === 0) { T.setColor(plinth); fbox(T, f, 0, f.len, 0, 0.07, base - 0.35, base + 0.55); }
        if (tier === 2 && !(b.roof && b.roof.shape && b.roof.shape !== "flat") && !L.house) {   // cornice under a flat roof
          T.setColor(palette.trim);
          fbox(T, f, -0.05, f.len + 0.05, 0, 0.22, wallTop - 0.34, wallTop, true);
        }
        if (tier === 2 && !L.house && !b.glass && L.floors >= 3) {       // string courses
          T.setColor(tint(wallColor, 1.15));
          for (let k = 1; k < L.floors; k++) fbox(T, f, 0, f.len, 0, 0.07, yBase + k * L.fh - 0.07, yBase + k * L.fh + 0.07);
        }

        if (b.glass) {
          // curtain wall: one glass ribbon per storey with mullions, dark spandrel = the wall colour underneath
          if (f.len < 3) return;
          D.glass.setColor(palette.glass);
          for (let k = 0; k < L.floors; k++) {
            const yb = yBase + k * L.fh + L.fh * 0.3, yt = yBase + k * L.fh + L.fh * 0.92;
            fq(D.glass, f, 0.25, f.len - 0.25, 0.06, yb, yt);
          }
          if (tier === 2) {
            T.setColor(new THREE.Color(0x31363b));
            const nm = Math.max(1, Math.floor(f.len / 1.5));
            for (let m = 0; m <= nm; m++) {
              const s = 0.25 + ((f.len - 0.5) * m) / nm;
              fbox(T, f, s - 0.04, s + 0.04, 0.04, 0.12, yBase, eaveY - 0.15);
            }
            T.setColor(new THREE.Color(0x454b52));
            for (let k = 0; k <= L.floors; k++) fbox(T, f, 0, f.len, 0, 0.16, yBase + k * L.fh - 0.08, yBase + k * L.fh + 0.08);
          }
          return;
        }
        if (L.noWindows) return;

        const margin = 0.9, usable = f.len - 2 * margin, nb = Math.floor(usable / L.bay);
        if (nb < 1) return;
        const step = usable / nb;
        const shop = RETAIL_KINDS.has(L.kind);
        for (let k = 0; k < L.floors; k++) {
          const ground = k === 0;
          const w = shop && ground ? Math.min(step * 0.78, 3.2) : L.house ? Math.min(1.15, step * 0.5) : Math.min(1.6, step * 0.5);
          const h = shop && ground ? Math.min(2.1, L.fh * 0.7) : L.house ? Math.min(1.3, L.fh * 0.48) : Math.min(1.65, L.fh * 0.52);
          const sill = shop && ground ? 0.5 : (L.fh - h) * 0.5;
          const y0 = yBase + k * L.fh + sill;
          if (y0 + h > eaveY - 0.2) continue;
          for (let m = 0; m < nb; m++) {
            const s = margin + step * (m + 0.5);
            if (door && door.edge === ei && ground && s + w / 2 > door.s0 && s - w / 2 < door.s1) continue;
            if (ground) {   // don't bury windows on the uphill side of a slope
              const gx = f.ax + f.tx * s + f.nx * 0.05, gz = f.az + f.tz * s + f.nz * 0.05;
              if (elevationAt(gx, gz) > y0 - 0.15) continue;
            }
            addWindow(D, f, s, y0, w, h, tier, palette);
            if (tier === 2 && k >= 1 && APARTMENT_KINDS.has(L.kind) && L.floors >= 3 && m % 2 === 1 && balconies.length < 48) balconies.push([f, s, yBase + k * L.fh, step]);
          }
        }
      });

      // ---- balconies (apartments) ----
      for (const [f, s, yf, step] of balconies) {
        const hw = Math.min(step * 0.36, 1.1);
        T.setColor(tint(wallColor, 1.12));
        fbox(T, f, s - hw, s + hw, 0, 1.15, yf, yf + 0.14, true);
        T.setColor(new THREE.Color(0x9aa0a6));
        fbox(T, f, s - hw, s + hw, 1.08, 1.14, yf + 0.14, yf + 1.02);         // front rail panel
        fbox(T, f, s - hw, s - hw + 0.05, 0, 1.14, yf + 0.14, yf + 1.02);     // side rails
        fbox(T, f, s + hw - 0.05, s + hw, 0, 1.14, yf + 0.14, yf + 1.02);
      }

      // ---- corner posts ----
      if (tier === 2 && !b.glass && (L.house || polyArea(ringW) < 700) && b.height < 16) {
        for (let i = 0; i < n; i++) {
          const fp = edges[(i - 1 + n) % n], fn = edges[i];
          if (!fp || !fn || fp.covered || fn.covered) continue;
          if (Math.abs(fp.tx * fn.tx + fp.tz * fn.tz) > 0.3) continue;   // only roughly right-angle corners
          const bx = fp.nx + fn.nx, bz = fp.nz + fn.nz, bl = Math.hypot(bx, bz) || 1;
          T.setColor(palette.trim);
          abox(T, fn.ax + (bx / bl) * 0.05, fn.az + (bz / bl) * 0.05, fn.tx, fn.tz, 0.13, 0.13, base - 0.1, eaveY + 0.05);
        }
      }

      // ---- roof details ----
      const area = polyArea(ringW);
      const pitched = b.roof && b.roof.shape && b.roof.shape !== "flat";
      if (tier === 2 && pitched && (b.roof.shape === "gabled" || b.roof.shape === "hipped") && L.house && area > 30 && area < 500 && r(7) < 0.7) {
        const box = orientedBox(ringW);
        if (area / Math.max(box.L * box.W, 1e-6) >= 0.85) {
          const rh = b.roof.h ?? defaultRoofHeight(b.roof.shape, box);
          const hl = box.L / 2, ri = b.roof.shape === "hipped" ? Math.max(hl - box.W / 2, 0) : hl;
          let u = (r(8) < 0.5 ? -1 : 1) * hl * 0.4;
          u = Math.max(-ri * 0.7, Math.min(ri * 0.7, u));
          const cx = box.cx + u * box.c, cz = box.cy + u * box.s;
          T.setColor(new THREE.Color(0x8a4b3c));
          abox(T, cx, cz, box.c, box.s, 0.3, 0.3, eaveY + rh * 0.4, eaveY + rh + 0.95);
          T.setColor(new THREE.Color(0x6c6a66));
          abox(T, cx, cz, box.c, box.s, 0.4, 0.4, eaveY + rh + 0.95, eaveY + rh + 1.08);
        }
      } else if (tier === 2 && !pitched && !L.house && area >= 80) {
        const inner = insetRing(ringW, 1.6) || insetRing(ringW, 1.0);
        if (inner) {
          let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
          for (const [x, z] of ringW) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
          const rndPt = (salt) => {
            for (let a = 0; a < 20; a++) {
              const x = x0 + (x1 - x0) * hash01(id, salt * 31 + a * 2), z = z0 + (z1 - z0) * hash01(id, salt * 31 + a * 2 + 1);
              if (pointInRing(x, z, inner)) return [x, z];
            }
            return null;
          };
          const box = orientedBox(ringW);
          const top = eaveY + (b.glass ? 0 : 0);
          const nUnits = Math.min(5, 1 + Math.floor(area / 300));
          for (let k = 0; k < nUnits; k++) {
            const p = rndPt(10 + k); if (!p) continue;
            const hx = 0.7 + hash01(id, 40 + k) * 0.9, hz = 0.5 + hash01(id, 50 + k) * 0.7, hh = 0.8 + hash01(id, 60 + k) * 0.9;
            T.setColor(new THREE.Color(0x9ca2a8));
            abox(T, p[0], p[1], box.c, box.s, hx, hz, top, top + hh);
            T.setColor(new THREE.Color(0x60656b));
            abox(T, p[0], p[1], box.c, box.s, hx * 0.8, hz * 0.8, top + hh, top + hh + 0.08);
            if (hash01(id, 70 + k) < 0.5) {   // vent pipe
              T.setColor(new THREE.Color(0xd8dadc));
              abox(T, p[0] + hx + 0.5, p[1], box.c, box.s, 0.1, 0.1, top, top + 0.9 + hash01(id, 80 + k) * 0.7);
            }
          }
          if (b.height >= 10 && area >= 150) {   // stair / lift bulkhead
            const cx = ringW.reduce((s, p) => s + p[0], 0) / n, cz = ringW.reduce((s, p) => s + p[1], 0) / n;
            const p = pointInRing(cx, cz, inner) ? [cx, cz] : rndPt(99);
            if (p) {
              const big = b.height >= 30;
              const hx = Math.min(big ? 4.5 : 2.0, box.L * 0.18), hz = Math.min(big ? 3.5 : 1.6, box.W * 0.18), hh = big ? 3.8 : 2.6;
              T.setColor(tint(wallColor, 0.88));
              abox(T, p[0], p[1], box.c, box.s, hx, hz, top, top + hh);
              T.setColor(new THREE.Color(0x5b6066));
              abox(T, p[0], p[1], box.c, box.s, hx + 0.12, hz + 0.12, top + hh, top + hh + 0.2);
              if (b.height >= 60) {   // antenna
                T.setColor(new THREE.Color(0xc23b3b));
                abox(T, p[0], p[1], 1, 0, 0.12, 0.12, top + hh + 0.2, top + hh + 9);
              }
            }
          }
        }
      }

      return { detail: D.detail.toGeometry(), windows: D.glass.toGeometry() };
    }

    // ---- editable state (this is what gets saved / undone) ----
    const buildings = new Map();   // id -> building record (see above)
    let removed = new Set();       // OSM building ids that are hidden
    let placements = [];           // imported .glb instances: { pid, modelName, x, z, rotY, sx, sy, sz, replaces }
    let selected = null;           // building id ("osm-..." / "custom-...") or placement id ("pl-...")
    let buildingMeshes = [];
    const placementGroup = new THREE.Group();
    scene.add(placementGroup);
    const history = [];            // JSON snapshots for undo

    const newId = (prefix) => prefix + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    // Per-building geometry cache: editing one building doesn't rebuild the other few thousand.
    const partsCache = new Map();   // id -> { key, parts }
    let terrainStamp = 0;           // bumped when real elevation arrives (invalidates cached geometry)

    function rebuildBuildings() {
      buildingMeshes.forEach((m) => { scene.remove(m); m.geometry.dispose(); });
      buildingMeshes = [];

      const buckets = {
        roof:   { geos: [], owners: [], mat: roofMat },
        wall:   { geos: [], owners: [], mat: wallMat },
        glass:  { geos: [], owners: [], mat: glassMat },
        detail: { geos: [], owners: [], mat: detailMat, noPick: true },
        window: { geos: [], owners: [], mat: windowMat, noPick: true }
      };
      const put = (bucket, geo, id) => {
        bucket.geos.push(geo);
        for (let i = 0, n = geo.attributes.position.count / 3; i < n; i++) bucket.owners.push(id);   // one entry per triangle
      };

      // visible buildings, nearest to the picked centre first, get detail tiers under the triangle budget
      const items = [];
      for (const b of buildings.values()) {
        if (removed.has(b.id)) continue;
        const ring = cleanRing(b.footprint);
        if (ring.length < 3) continue;
        const ringW = ring.map(([x, n]) => [x, -n]);
        const cx = ringW.reduce((s, p) => s + p[0], 0) / ringW.length, cz = ringW.reduce((s, p) => s + p[1], 0) / ringW.length;
        items.push({ b, id: b.id, ringW, dist: Math.hypot(cx, cz) });
      }
      const neighbors = makeNeighborIndex(items);
      items.sort((p, q) => p.dist - q.dist);
      let used = 0;
      for (const it of items) {
        it.tier = 0;
        if (!DETAIL_BUDGET) continue;
        const e2 = estimateDetail(it.ringW, it.b, 2);
        if (used + e2 <= DETAIL_BUDGET) { it.tier = 2; used += e2; continue; }
        const e1 = estimateDetail(it.ringW, it.b, 1);
        if (used + e1 <= DETAIL_BUDGET * 1.9) { it.tier = 1; used += e1; }
      }

      const live = new Set();
      for (const it of items) {
        const b = it.b;
        live.add(b.id);
        try {
          const key = JSON.stringify(b) + "|" + terrainStamp + "|" + it.tier + "|" + (it.tier ? neighbors.signature(b.id) : "");
          let entry = partsCache.get(b.id);
          if (!entry || entry.key !== key) {
            entry = { key, parts: buildingParts(b, { tier: it.tier, neighbors }) };
            partsCache.set(b.id, entry);
          }
          const parts = entry.parts;
          if (!parts) continue;
          for (const g of parts.walls) put(parts.glass ? buckets.glass : buckets.wall, g, b.id);
          for (const g of parts.roofs) { projectRoofUVs(g); put(buckets.roof, g, b.id); }
          if (parts.detail) put(buckets.detail, parts.detail, b.id);
          if (parts.windows) put(buckets.window, parts.windows, b.id);
        } catch (err) {
          console.warn("Skipped a building:", b.id, err);
        }
      }
      for (const id of [...partsCache.keys()]) if (!live.has(id) && !buildings.has(id)) partsCache.delete(id);

      for (const k in buckets) {
        const { geos, owners, mat, noPick } = buckets[k];
        if (!geos.length) continue;
        const merged = mergeGeometries(geos, false);   // (cached geometries are kept - never dispose them here)
        if (!merged) continue;
        const mesh = new THREE.Mesh(merged, mat);
        mesh.castShadow = k !== "detail" && k !== "window";
        mesh.receiveShadow = true;
        mesh.userData.owners = owners;    // triangle index -> building id
        if (noPick) mesh.userData.noPick = true;   // windows/trim are never the crosshair target (their wall is)
        scene.add(mesh);
        buildingMeshes.push(mesh);
      }
      if (DETAIL_PARAM === "debug") console.log("detail tris ~", used);
    }

    async function loadBuildings() {
      const query = `[out:json][timeout:25];way["building"](around:${radiusMeters},${centerLat},${centerLng});out geom;`;
      const data = await fetchOverpass(query);
      const ways = data.elements.filter((el) => el.type === "way" && el.geometry);
      console.log("Overpass returned", data.elements.length, "elements,", ways.length, "usable building ways");

      for (const el of ways) {
        const tags = el.tags || {};
        const footprint = el.geometry.map((pt) => latLngToLocal(pt.lat, pt.lon, centerLat, centerLng));
        const ring = cleanRing(footprint);
        if (ring.length < 3) continue;

        const levels = num(tags["building:levels"], DEFAULT_LEVELS[tags.building] ?? 3);
        const totalTag = num(tags.height, NaN);                        // OSM "height" = eaves + roof
        let wallHeight = Number.isFinite(totalTag) ? totalTag : levels * 3;
        const roof = pickRoof(tags, ring, wallHeight);
        if (roof) {
          const box = orientedBox(ring.map(([x, n]) => [x, -n]));
          if (roof.h === undefined) roof.h = defaultRoofHeight(roof.shape, box);
          if (Number.isFinite(totalTag)) wallHeight = Math.max(2.5, totalTag - roof.h);   // keep the overall height honest
        }
        const totalHeight = wallHeight + (roof ? roof.h : 0);

        const id = "osm-" + el.id;
        buildings.set(id, {
          id, footprint, height: wallHeight, roof, kind: tags.building || "yes",
          minHeight: num(tags.min_height, 0),
          wallColor: getWallColor(tags, totalHeight).getHex(),
          roofColor: getRoofColor(tags).getHex(),
          glass: isGlassBuilding(tags, totalHeight)
        });
      }

      rebuildBuildings();
      updateHighlight();
      updateUI();
      console.log(ways.length + " buildings loaded");
    }

    // =====================================================================
    // 6. Roads, paths, parks, water and trees
    //    Flat things (roads, paths, parks, water) are painted onto a canvas that becomes the
    //    terrain's ground texture, so they follow the hills for free. Raised things (sidewalks,
    //    curbs, street lamps, trees) are real geometry standing on elevationAt().
    // =====================================================================
    const ROAD_WIDTH = {
      motorway: 14, motorway_link: 7, trunk: 13, trunk_link: 7, primary: 13, primary_link: 7,
      secondary: 11, secondary_link: 6, tertiary: 10, tertiary_link: 6, residential: 8.5,
      unclassified: 8.5, living_street: 6.5, service: 5, road: 7.5, busway: 6
    };
    const PATH_WIDTH = {
      footway: 2, path: 1.8, pedestrian: 5, cycleway: 2.5, steps: 1.8, track: 3, bridleway: 2
    };
    const SIDEWALK_W = { primary: 2.5, secondary: 2.2, tertiary: 2, residential: 1.8, unclassified: 1.8, living_street: 1.6 };
    const CURB_H = 0.15;

    // ---- flat areas (parks, water, woods) ----
    function classifyArea(tags) {
      // parking lots are repainted as asphalt even over the satellite photo (hides the parked cars)
      if (tags.amenity === "parking" && tags.parking !== "multi-storey" && tags.parking !== "underground" && tags.parking !== "rooftop")
        return { color: "#4a4f55", layer: 2, overlay: true, noTrees: true };
      if (tags.natural === "water" || tags.waterway === "riverbank") return { color: "#5b9bd5", layer: 2, noTrees: true };
      if (tags.natural === "wetland") return { color: "#8fb8a0", layer: 1, noTrees: true };
      if (tags.natural === "wood" || tags.landuse === "forest") return { color: "#6fa365", layer: 1 };
      if (tags.natural === "scrub" || tags.landuse === "orchard") return { color: "#86ad6f", layer: 1 };
      if (tags.leisure === "pitch" || tags.leisure === "playground") return { color: "#7fb56a", layer: 2 };
      if (tags.landuse === "cemetery") return { color: "#9db98a", layer: 1 };
      if (tags.landuse === "farmland" || tags.landuse === "allotments") return { color: "#c9d29a", layer: 1 };
      if (tags.leisure || tags.landuse || tags.natural) return { color: "#8fbf7a", layer: 1 };
      return null;
    }

    // Join the loose outer edges of a multipolygon relation into closed rings
    function stitchRings(segments) {
      const key = (p) => p.lat.toFixed(7) + "," + p.lon.toFixed(7);
