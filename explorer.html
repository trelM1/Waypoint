      const segs = segments.filter((s) => s.length > 1).map((s) => s.slice());
      const rings = [];
      while (segs.length) {
        let ring = segs.pop();
        let changed = true;
        while (changed && key(ring[0]) !== key(ring[ring.length - 1])) {
          changed = false;
          const end = key(ring[ring.length - 1]);
          for (let i = 0; i < segs.length; i++) {
            const s = segs[i];
            if (key(s[0]) === end) { ring = ring.concat(s.slice(1)); segs.splice(i, 1); changed = true; break; }
            if (key(s[s.length - 1]) === end) { ring = ring.concat(s.slice(0, -1).reverse()); segs.splice(i, 1); changed = true; break; }
          }
        }
        if (ring.length >= 4) rings.push(ring);
      }
      return rings;
    }

    // ---- parse the Overpass elements once into world-space areas / roads / paths ----
    // tree density (trees per m^2) for a natural/leisure/landuse area; 0 = none
    function treeDensity(tags) {
      if (tags.natural === "wood" || tags.landuse === "forest") return 1 / 45;
      if (tags.natural === "scrub") return 1 / 120;
      if (tags.landuse === "orchard") return 1 / 60;
      if (tags.landuse === "cemetery") return 1 / 300;
      if (tags.landuse === "grass" || tags.landuse === "meadow" || tags.landuse === "village_green") return 1 / 320;
      if (/^(park|garden|common|nature_reserve|recreation_ground|golf_course)$/.test(tags.leisure || "") || tags.landuse === "recreation_ground") return 1 / 200;
      return 0;
    }

    function parseEnv(elements) {
      const areas = [], roads = [], paths = [];
      const addArea = (tags, pts) => {
        const style = classifyArea(tags);
        if (style && pts.length >= 3) areas.push({ style, pts, dens: treeDensity(tags), conifer: tags.natural === "wood" || tags.landuse === "forest" ? 0.35 : 0.08 });
      };
      for (const el of elements) {
        const tags = el.tags || {};
        if (el.type === "way" && el.geometry) {
          if (tags.highway) {
            if (tags.tunnel === "yes") continue;
            const pts = el.geometry.map((pt) => toWorld(pt.lat, pt.lon));
            if (ROAD_WIDTH[tags.highway]) {
              const lanes = num(tags.lanes, 0);
              roads.push({
                pts, width: num(tags.width, Math.max(ROAD_WIDTH[tags.highway], lanes * 3.3)),
                kind: tags.highway, oneway: tags.oneway === "yes" || tags.oneway === "-1"
              });
            } else if (PATH_WIDTH[tags.highway]) {
              paths.push({ pts, width: PATH_WIDTH[tags.highway] });
            }
            continue;
          }
          addArea(tags, el.geometry.map((pt) => toWorld(pt.lat, pt.lon)));
        } else if (el.type === "relation" && el.members) {
          const outers = el.members.filter((m) => m.type === "way" && m.role === "outer" && m.geometry).map((m) => m.geometry);
          for (const ring of stitchRings(outers)) addArea(tags, ring.map((pt) => toWorld(pt.lat, pt.lon)));
        }
      }
      areas.sort((a, b) => a.style.layer - b.style.layer);
      roads.sort((a, b) => a.width - b.width);   // wide roads on top of narrow ones
      return { areas, roads, paths };
    }

    // ---- ground texture: OSM painted flat, or OSM roads/parking painted OVER the satellite photo ----
    // Painting asphalt over the photo hides the parked/driving cars that are baked into the imagery
    // and gives the roads crisp edges and lane markings.
    let groundTex = null;
    function paintGroundTexture() {
      if (!envParsed) return;
      const S = satImage ? 4096 : (radiusMeters <= 500 ? 4096 : 2048), r = radiusMeters, k = S / (2 * r);
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = S;
      const ctx = canvas.getContext("2d");
      if (satImage) {
        ctx.drawImage(satImage, 0, 0, S, S);
      } else {
        ctx.fillStyle = "#a4ae95";
        ctx.fillRect(0, 0, S, S);
      }
      // canvas row 0 = north = -z (the texture is flipped when uploaded), column 0 = west
      const px = (p) => [(p[0] + r) * k, (p[1] + r) * k];
      const trace = (pts) => { ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = px(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); };

      // areas: with imagery only parking lots (cars) are repainted; without, everything is
      for (const a of envParsed.areas) {
        if (satImage && !a.style.overlay) continue;
        ctx.fillStyle = a.style.color;
        trace(a.pts);
        ctx.closePath();
        ctx.fill();
      }

      const ASPHALT = satImage ? "#3a3e43" : "#33373c", EDGE = "#dcdad0", CENTER = "#e6c34a";
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      const stroke = (pts, color, widthM, minPx) => {
        if (pts.length < 2) return;
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(widthM * k, minPx);
        ctx.setLineDash([]);
        trace(pts);
        ctx.stroke();
      };
      const roads = envParsed.roads;
      // 1) pale edge lines (a slightly wider stroke under the asphalt), 2) asphalt + centre line, narrow to wide
      ctx.lineCap = "butt";
      for (const rd of roads) if (rd.width >= 7) stroke(rd.pts, EDGE, rd.width, 2);
      ctx.lineCap = "round";
      for (const rd of roads) {
        const marked = rd.width >= 7;
        stroke(rd.pts, ASPHALT, marked ? rd.width - 0.7 : rd.width, 1.5);
        if (marked && !rd.oneway && rd.kind !== "service" && rd.kind !== "motorway" && rd.kind !== "motorway_link" && !/_link$/.test(rd.kind)) {
          ctx.lineCap = "butt";
          ctx.strokeStyle = CENTER;
          ctx.lineWidth = Math.max((rd.width >= 11 ? 0.3 : 0.18) * k, 1.4);
          ctx.setLineDash(rd.width >= 11 ? [] : [3 * k, 4.5 * k]);
          trace(rd.pts);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.lineCap = "round";
        }
      }
      // footpaths: only when there's no photo (the photo already shows real paths)
      if (!satImage) for (const pa of envParsed.paths) stroke(pa.pts, "#d2ccbb", pa.width, 1.2);

      if (groundTex) groundTex.dispose();
      groundTex = new THREE.CanvasTexture(canvas);
      groundTex.colorSpace = THREE.SRGBColorSpace;
      groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      setGroundTexture(groundTex);
    }

    // ---- raised environment: sidewalks + curbs, street lamps, trees ----
    const envGroup = new THREE.Group();
    scene.add(envGroup);
    let envElements = null;

    function clearGroup(g) {
      g.traverse((o) => { if (o.isInstancedMesh) o.dispose(); if (o.geometry) o.geometry.dispose(); });
      g.clear();
    }

    function collectRoads(elements) {
      const roads = [];
      for (const el of elements) {
        if (el.type !== "way" || !el.geometry) continue;
        const t = el.tags || {};
        if (!t.highway || !ROAD_WIDTH[t.highway] || t.tunnel === "yes") continue;
        const pts = el.geometry.map((p) => toWorld(p.lat, p.lon));
        if (pts.length < 2) continue;
        const width = num(t.width, Math.max(ROAD_WIDTH[t.highway], num(t.lanes, 0) * 3.3));
        let sw = SIDEWALK_W[t.highway] || 0;
        if (t.sidewalk === "no" || t.sidewalk === "none" || t.bridge === "yes") sw = 0;
        roads.push({ id: el.id, pts, half: width / 2, sw });
      }
      return roads;
    }

    // Spatial hash of road segments, used to open gaps in the sidewalks where another road crosses or joins.
    function makeSegGrid(roads, cell = 16) {
      const map = new Map();
      const key = (i, j) => (i + 4096) * 8192 + (j + 4096);
      for (const road of roads) {
        for (let i = 0; i < road.pts.length - 1; i++) {
          const [ax, az] = road.pts[i], [bx, bz] = road.pts[i + 1];
          const len = Math.hypot(bx - ax, bz - az);
          if (len < 1e-6) continue;
          const seg = { road, ax, az, len, dx: (bx - ax) / len, dz: (bz - az) / len };
          const i0 = Math.floor(Math.min(ax, bx) / cell) - 1, i1 = Math.floor(Math.max(ax, bx) / cell) + 1;
          const j0 = Math.floor(Math.min(az, bz) / cell) - 1, j1 = Math.floor(Math.max(az, bz) / cell) + 1;
          for (let ii = i0; ii <= i1; ii++) for (let jj = j0; jj <= j1; jj++) {
            const k = key(ii, jj);
            if (!map.has(k)) map.set(k, []);
            map.get(k).push(seg);
          }
        }
      }
      // true if another road (not roughly parallel) is close enough that a sidewalk here would run across it
      return (x, z, tx, tz, own) => {
        const list = map.get(key(Math.floor(x / cell), Math.floor(z / cell)));
        if (!list) return false;
        for (const s of list) {
          if (s.road === own) continue;
          const t = Math.min(Math.max((x - s.ax) * s.dx + (z - s.az) * s.dz, 0), s.len);
          const d = Math.hypot(x - (s.ax + s.dx * t), z - (s.az + s.dz * t));
          if (d < s.road.half + s.road.sw + 0.6 && Math.abs(tx * s.dx + tz * s.dz) < 0.94) return true;
        }
        return false;
      };
    }

    function densify(pts, maxSeg) {
      const out = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / maxSeg));
        for (let k = 1; k <= n; k++) out.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
      }
      return out;
    }

    function buildSidewalks(roads, blocked) {
      const pos = [], col = [];
      const SIDEWALK = new THREE.Color(0xcfccc3), CURB = new THREE.Color(0xa9a69e), EDGE = new THREE.Color(0x8f8c85);
      const quad = (a, b, c, d, color) => {
        for (const p of [a, b, c, a, c, d]) { pos.push(p[0], p[1], p[2]); col.push(color.r, color.g, color.b); }
      };
      const at = (x, z, dy) => [x, elevationAt(x, z) + dy, z];

      for (const road of roads) {
        if (road.sw <= 0) continue;
        const pts = densify(road.pts, 4), S = pts.length;
        const tan = [], open = [];
        for (let i = 0; i < S; i++) {
          const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, S - 1)];
          const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
          tan.push([(b[0] - a[0]) / l, (b[1] - a[1]) / l]);
          open.push(!blocked(pts[i][0], pts[i][1], tan[i][0], tan[i][1], road));
        }
        for (const side of [1, -1]) {
          for (let i = 0; i < S - 1; i++) {
            if (!open[i] || !open[i + 1]) continue;
            const edge = (j, off) => [pts[j][0] + -tan[j][1] * side * off, pts[j][1] + tan[j][0] * side * off];
            const i0 = edge(i, road.half), i1 = edge(i + 1, road.half);
            const o0 = edge(i, road.half + road.sw), o1 = edge(i + 1, road.half + road.sw);
            // curb face (road side), sidewalk top, outer edge face
            quad(at(i0[0], i0[1], 0), at(i1[0], i1[1], 0), at(i1[0], i1[1], CURB_H), at(i0[0], i0[1], CURB_H), CURB);
            quad(at(i0[0], i0[1], CURB_H), at(o0[0], o0[1], CURB_H), at(o1[0], o1[1], CURB_H), at(i1[0], i1[1], CURB_H), SIDEWALK);
            quad(at(o0[0], o0[1], CURB_H), at(o1[0], o1[1], CURB_H), at(o1[0], o1[1], -0.05), at(o0[0], o0[1], -0.05), EDGE);
          }
        }
      }
      if (!pos.length) return;
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
      g.computeVertexNormals();
      const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, side: THREE.DoubleSide }));
      mesh.receiveShadow = true;   // (not castShadow: a flat strip shadowing itself causes streaky acne)
      envGroup.add(mesh);
    }

    function buildLamps(roads, blocked) {
      const spots = [];
      const SPACING = 38;
      for (const road of roads) {
        if (road.sw <= 0) continue;
        let nextAt = SPACING / 2, travelled = 0, side = 1;   // distances measured along the whole road
        for (let i = 0; i < road.pts.length - 1; i++) {
          const a = road.pts[i], b = road.pts[i + 1], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
          if (len < 1e-6) continue;
          const dx = (b[0] - a[0]) / len, dz = (b[1] - a[1]) / len;
          while (nextAt < travelled + len) {
            const s = nextAt - travelled, x = a[0] + dx * s, z = a[1] + dz * s;
            if (!blocked(x, z, dx, dz, road)) {          // no lamps in the middle of an intersection
              const off = road.half + road.sw * 0.55;
              const lx = x + -dz * side * off, lz = z + dx * side * off;
              spots.push([lx, elevationAt(lx, lz) + CURB_H, lz]);
              side = -side;                              // alternate sides of the street
            }
            nextAt += SPACING;
          }
          travelled += len;
        }
        if (spots.length > 1500) break;
      }
      if (!spots.length) return;
      const poles = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.07, 0.1, 1, 6),
        new THREE.MeshStandardMaterial({ color: 0x4a4f55, roughness: 0.7, metalness: 0.4 }), spots.length);
      const heads = new THREE.InstancedMesh(new THREE.SphereGeometry(0.3, 8, 6),
        new THREE.MeshStandardMaterial({ color: 0xfff2c9, emissive: 0xffe9a8, emissiveIntensity: 0.8, roughness: 0.4 }), spots.length);
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
      spots.forEach(([x, y, z], i) => {
        p.set(x, y + 3.25, z); s.set(1, 6.5, 1); poles.setMatrixAt(i, m.compose(p, q, s));
        p.set(x, y + 6.6, z); s.set(1, 0.7, 1); heads.setMatrixAt(i, m.compose(p, q, s));
      });
      poles.castShadow = true;
      envGroup.add(poles, heads);
    }

    // ---- trees: OSM tree nodes + generated street trees + trees scattered over parks, lawns and woods ----
    // "Occupied" map (1 cell ~ 1-2 m): roads + sidewalks, footpaths, buildings, water and parking lots, so generated trees
    // never land on them.
    function makeOccupancy(roads) {
      const S = 1024, r = radiusMeters, k = S / (2 * r);
      const c = document.createElement("canvas");
      c.width = c.height = S;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, S, S);
      ctx.fillStyle = ctx.strokeStyle = "#fff";
      ctx.lineJoin = ctx.lineCap = "round";
      const trace = (pts, close) => {
        ctx.beginPath();
        pts.forEach((p, i) => { const x = (p[0] + r) * k, y = (p[1] + r) * k; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        if (close) ctx.closePath();
      };
      for (const a of envParsed.areas) if (a.style.noTrees) { trace(a.pts, true); ctx.fill(); }
      for (const rd of roads) { ctx.lineWidth = (rd.half * 2 + rd.sw * 2 + 1.2) * k; trace(rd.pts); ctx.stroke(); }
      for (const pa of envParsed.paths) { ctx.lineWidth = (pa.width + 1.2) * k; trace(pa.pts); ctx.stroke(); }
      for (const b of buildings.values()) {
        const pts = b.footprint.map(([x, y]) => [x, -y]);   // footprint y = north, world z = -north
        ctx.lineWidth = 2.5 * k; trace(pts, true); ctx.fill(); ctx.stroke();
      }
      const data = ctx.getImageData(0, 0, S, S).data;
      return (x, z) => {
        const ix = Math.floor((x + r) * k), iz = Math.floor((z + r) * k);
        if (ix < 0 || iz < 0 || ix >= S || iz >= S) return false;
        return data[(iz * S + ix) * 4] < 128;
      };
    }

    function pointInPoly(x, z, pts) {
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, zi] = pts[i], [xj, zj] = pts[j];
        if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
      }
      return inside;
    }

    function buildTrees(elements, roads) {
      const dec = [], con = [];
      const MAX_GENERATED = 5000;
      // 1) real mapped trees
      for (const el of elements) {
        if (el.type !== "node") continue;
        const [x, z] = toWorld(el.lat, el.lon);
        ((el.tags || {}).leaf_type === "needleleaved" ? con : dec).push({ x, z, s: el.id });
        if (dec.length + con.length >= 4000) break;
      }
      // 2) generated trees (deterministic, so they don't move between rebuilds)
      let seed = Math.floor((centerLat * 1e4 + centerLng * 1e4) * 7919) >>> 0;
      const rand = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const free = makeOccupancy(roads);
      const gen = [];   // {x, z, con}
      // street trees: just outside the sidewalk, alternating sides
      for (const road of roads) {
        if (road.sw <= 0) continue;
        let nextAt = 6 + rand() * 8, travelled = 0, side = rand() < 0.5 ? 1 : -1;
        for (let i = 0; i < road.pts.length - 1; i++) {
          const a = road.pts[i], b = road.pts[i + 1], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
          if (len < 1e-6) continue;
          const dx = (b[0] - a[0]) / len, dz = (b[1] - a[1]) / len;
          while (nextAt < travelled + len) {
            const s = nextAt - travelled, x = a[0] + dx * s, z = a[1] + dz * s;
            const off = road.half + road.sw + 1.8 + rand() * 1.2;
            const tx = x + -dz * side * off, tz = z + dx * side * off;
            if (free(tx, tz)) gen.push({ x: tx, z: tz, con: rand() < 0.1 });
            side = -side;
            nextAt += 13 + rand() * 9;
          }
          travelled += len;
        }
      }
      // parks, lawns, woods: jittered grid inside each polygon
      for (const a of envParsed.areas) {
        if (!a.dens) continue;
        let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
        for (const [x, z] of a.pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
        const step = 1 / Math.sqrt(a.dens);
        if ((x1 - x0) * (z1 - z0) / (step * step) > 60000) continue;   // absurdly large polygon
        for (let gx = x0; gx < x1; gx += step) {
          for (let gz = z0; gz < z1; gz += step) {
            const x = gx + (rand() - 0.5) * step * 0.9, z = gz + (rand() - 0.5) * step * 0.9;
            if (Math.abs(x) > radiusMeters || Math.abs(z) > radiusMeters) continue;
            if (pointInPoly(x, z, a.pts) && free(x, z)) gen.push({ x, z, con: rand() < a.conifer });
          }
        }
      }
      const keep = gen.length > MAX_GENERATED ? MAX_GENERATED / gen.length : 1;
      gen.forEach((g, i) => {
        if (keep < 1 && rand() > keep) return;
        (g.con ? con : dec).push({ x: g.x, z: g.z, s: 1e7 + i });
      });

      const total = dec.length + con.length;
      if (!total) return;
      const rnd = (id, salt) => { const v = Math.sin(id * 12.9898 + salt * 78.233) * 43758.5453; return v - Math.floor(v); };
      const white = () => new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true });

      const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.22, 0.34, 1, 6),
        new THREE.MeshStandardMaterial({ color: 0x6b4f36, roughness: 1 }), total);
      const crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), white(), Math.max(dec.length, 1));
      const lobes  = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), white(), Math.max(dec.length, 1));
      const coneLo = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 8), white(), Math.max(con.length, 1));
      const coneHi = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 8), white(), Math.max(con.length, 1));
      crowns.count = lobes.count = dec.length; coneLo.count = coneHi.count = con.length;

      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
      const put = (mesh, i, x, y, z, sx, sy, sz) => { p.set(x, y, z); s.set(sx, sy, sz); mesh.setMatrixAt(i, m.compose(p, q, s)); };

      dec.forEach((n, i) => {
        const g = elevationAt(n.x, n.z), x = n.x, z = n.z;
        const k = 0.8 + rnd(n.s, 1) * 0.6, trunkH = 3 * k, r = 2.6 * k, a = rnd(n.s, 2) * Math.PI * 2;
        put(trunks, i, x, g + trunkH / 2, z, k, trunkH, k);
        put(crowns, i, x, g + trunkH + r * 0.65, z, r, r * 1.05, r);
        put(lobes, i, x + Math.cos(a) * r * 0.55, g + trunkH + r * 0.4, z + Math.sin(a) * r * 0.55, r * 0.65, r * 0.6, r * 0.65);
        c.setHSL(0.27 + (k - 1) * 0.08, 0.45, 0.30 + (k - 0.8) * 0.12);
        crowns.setColorAt(i, c);
        lobes.setColorAt(i, c.offsetHSL(0.01, 0, 0.03));
      });
      con.forEach((n, j) => {
        const i = dec.length + j;
        const g = elevationAt(n.x, n.z), x = n.x, z = n.z;
        const k = 0.9 + rnd(n.s, 3) * 0.6;
        put(trunks, i, x, g + 0.7 * k, z, k, 1.4 * k, k);
        put(coneLo, j, x, g + 1.0 * k + 1.7 * k, z, 1.9 * k, 3.4 * k, 1.9 * k);
        put(coneHi, j, x, g + 3.0 * k + 1.4 * k, z, 1.3 * k, 2.8 * k, 1.3 * k);
        c.setHSL(0.36, 0.42, 0.20 + rnd(n.s, 4) * 0.06);
        coneLo.setColorAt(j, c); coneHi.setColorAt(j, c.offsetHSL(0, 0, 0.03));
      });
      for (const mesh of [trunks, crowns, lobes, coneLo, coneHi]) {
        mesh.castShadow = mesh !== lobes; mesh.receiveShadow = true;   // lobes skip the shadow pass (thousands of trees)
        mesh.instanceMatrix.needsUpdate = true;
        if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
        envGroup.add(mesh);
      }
      console.log(`Trees: ${dec.length} deciduous + ${con.length} conifer`);
    }

    function buildEnvironment3D() {
      clearGroup(envGroup);
      if (!envElements) return;
      const roads = collectRoads(envElements);
      const blocked = makeSegGrid(roads);
      buildSidewalks(roads, blocked);
      buildLamps(roads, blocked);
      buildTrees(envElements, roads);
    }

    async function loadEnvironment() {
      const a = `(around:${radiusMeters},${centerLat},${centerLng})`;
      const query = `[out:json][timeout:30];(
        way["highway"]${a};
        way["amenity"="parking"]${a};
        way["leisure"~"^(park|garden|pitch|playground|golf_course|recreation_ground|nature_reserve|common)$"]${a};
        way["landuse"~"^(grass|forest|meadow|recreation_ground|village_green|cemetery|farmland|orchard|allotments)$"]${a};
        way["natural"~"^(wood|scrub|grassland|water|wetland)$"]${a};
        way["waterway"="riverbank"]${a};
        relation["natural"="water"]${a};
        relation["leisure"~"^(park|garden|nature_reserve|common)$"]${a};
        relation["landuse"~"^(grass|forest|meadow|recreation_ground)$"]${a};
        node["natural"="tree"]${a};
      );out geom;`;
      const data = await fetchOverpass(query);
      console.log("Environment: ", data.elements.length, "elements");
      envElements = data.elements;
      envParsed = parseEnv(envElements);
      paintGroundTexture();
      buildEnvironment3D();
    }

    // =====================================================================
    // 7. Editing: 3D model library, placements, selection, undo, saving
    // =====================================================================
    let toastTimer;
    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
    }

    // ---- geometry helpers ----
    // Centre, orientation (along the longest edge) and size of a footprint.
    // Returned x/z are WORLD coordinates (z = -north); rotY is the Y rotation that
    // lines a model's local X axis up with the footprint's long side.
    function footprintInfo(fp) {
      fp = cleanRing(fp);
      const cx = fp.reduce((s, p) => s + p[0], 0) / fp.length;   // rough centre, refined below
      const cy = fp.reduce((s, p) => s + p[1], 0) / fp.length;
      let best = 0, ang = 0;
      for (let i = 0; i < fp.length; i++) {
        const a = fp[i], b = fp[(i + 1) % fp.length];
        const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (len > best) { best = len; ang = Math.atan2(b[1] - a[1], b[0] - a[0]); }
      }
      const c = Math.cos(ang), s = Math.sin(ang);
      let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
      for (const [x, y] of fp) {
        const u = (x - cx) * c + (y - cy) * s, v = -(x - cx) * s + (y - cy) * c;
        minU = Math.min(minU, u); maxU = Math.max(maxU, u);
        minV = Math.min(minV, v); maxV = Math.max(maxV, v);
      }
      // centre of the oriented bounding box (better than the vertex average for L-shapes etc.)
      const mu = (minU + maxU) / 2, mv = (minV + maxV) / 2;
      const ex = cx + mu * c - mv * s, ey = cy + mu * s + mv * c;
      return { x: ex, z: -ey, rotY: ang, length: maxU - minU, width: maxV - minV };
    }

    // ---- model library ----
    const gltfLoader = new GLTFLoader();
    const modelLib = new Map(); // file name -> { root, size, offset }

    async function addModelFile(file) {
      const buf = await file.arrayBuffer();
      const gltf = await gltfLoader.parseAsync(buf, "");
      gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

      const root = new THREE.Group();
      root.add(gltf.scene);
      root.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(root);
      let size = box.getSize(new THREE.Vector3());
      if (size.z > size.x) {             // make the long axis X so it lines up with footprints
        root.rotation.y = Math.PI / 2;
        root.updateMatrixWorld(true);
        box = new THREE.Box3().setFromObject(root);
        size = box.getSize(new THREE.Vector3());
      }
      const c = box.getCenter(new THREE.Vector3());
      // offset: puts the model's footprint centre at the origin and its base on y = 0
      modelLib.set(file.name, { root, size, offset: new THREE.Vector3(-c.x, -box.min.y, -c.z) });

      refreshModelSelect(file.name);
      rebuildPlacements();      // placements that were waiting for this file appear now
      updateHighlight();
      updateUI();
      toast(`Loaded ${file.name} (${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)} m)`);
    }

    function refreshModelSelect(activeName) {
      const sel = $("modelSelect");
      const current = activeName || sel.value;
      sel.innerHTML = "";
      if (!modelLib.size) sel.innerHTML = '<option value="">(none loaded)</option>';
      for (const name of modelLib.keys()) {
        const o = document.createElement("option");
        o.value = o.textContent = name;
        sel.appendChild(o);
      }
      if (modelLib.has(current)) sel.value = current;
    }

    function computeScale(size, info, mode, heightOverride) {
      let sx = 1, sy = 1, sz = 1;
      if (info && mode !== "keep") {
        const kx = info.length / Math.max(size.x, 0.01);
        const kz = info.width / Math.max(size.z, 0.01);
        if (mode === "stretch") { sx = kx; sz = kz; sy = Math.min(kx, kz); }
        else { sx = sy = sz = Math.min(kx, kz); }
      }
      if (heightOverride > 0) sy = heightOverride / Math.max(size.y, 0.01);
      return { sx, sy, sz };
    }

    // ---- placements (imported models in the scene) ----
    // Ground height for a model: the lowest terrain under its (rotated, scaled) footprint
    function placementBase(p, m) {
      const hx = (m.size.x * p.sx) / 2, hz = (m.size.z * p.sz) / 2, c = Math.cos(p.rotY), s = Math.sin(p.rotY);
      let lo = elevationAt(p.x, p.z);
      for (const [ax, az] of [[hx, hz], [hx, -hz], [-hx, hz], [-hx, -hz]]) {
        lo = Math.min(lo, elevationAt(p.x + ax * c + az * s, p.z - ax * s + az * c));
      }
      return lo;
    }

    function makeHolder(p) {
      const m = modelLib.get(p.modelName);
      if (!m) return null;
      const holder = new THREE.Group();
      const inst = m.root.clone(true);   // shares geometry + materials, so it's cheap
      inst.position.copy(m.offset);
      holder.add(inst);
      holder.position.set(p.x, placementBase(p, m), p.z);

        // =====================================================================
    // 7.5 Real street photos (Mapillary)
    // =====================================================================
    function distMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    async function searchMapillary(lat, lng, degBox) {
      const url = `https://graph.mapillary.com/images?access_token=${MAPILLARY_TOKEN}` +
        `&fields=id,thumb_1024_url,compass_angle,captured_at,geometry` +
        `&bbox=${lng - degBox},${lat - degBox},${lng + degBox},${lat + degBox}` +
        `&limit=20`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Mapillary HTTP " + res.status);
      const json = await res.json();
      return json.data || [];
    }

    async function findNearestPhoto(lat, lng) {
      const attempts = [0.002, 0.006, 0.015];
      for (const degBox of attempts) {
        const results = await searchMapillary(lat, lng, degBox);
        if (!results.length) continue;
        const withDist = results.map((r) => ({
          ...r,
          distance: distMeters(lat, lng, r.geometry.coordinates[1], r.geometry.coordinates[0])
        })).sort((a, b) => a.distance - b.distance);
        return withDist[0];
      }
      return null;
    }
    window.findNearestPhoto = findNearestPhoto;
        // =====================================================================
    // 7.6 Isolated cutout render (for compositing onto a real photo)
    // =====================================================================
    // headingDeg: compass direction the "camera" faces, matching a photo's compass_angle (0 = north)
    async function renderCutout(id, headingDeg) {
      const snapScene = new THREE.Scene();   // no background = transparent
      snapScene.add(new THREE.HemisphereLight(0xbfdcff, 0x8a8f7a, 0.9));
      const sun2 = new THREE.DirectionalLight(0xfff2dd, 2.2);
      sun2.position.set(120, 200, 80);
      snapScene.add(sun2);

      let centerX = 0, centerZ = 0, objHeight = 10, objRadius = 15;

      if (id.startsWith("pl-")) {
        const p = placements.find((q) => q.pid === id);
        const m = p && modelLib.get(p.modelName);
        if (!p || !m) return null;
        const holder = makeHolder(p);
        snapScene.add(holder);
        centerX = p.x; centerZ = p.z;
        objHeight = m.size.y * p.sy;
        objRadius = Math.max(m.size.x * p.sx, m.size.z * p.sz) / 2;
      } else {
        const b = buildings.get(id);
        if (!b) return null;
        const parts = buildingParts(b);
        if (!parts) return null;
        for (const g of parts.walls) snapScene.add(new THREE.Mesh(g, parts.glass ? glassMat : wallMat));
        for (const g of parts.roofs) snapScene.add(new THREE.Mesh(g, roofMat));
        const info = footprintInfo(b.footprint);
        centerX = info.x; centerZ = info.z;
        objHeight = b.height + (b.roof ? (b.roof.h || 4) : 0);
        objRadius = Math.max(info.length, info.width) / 2;
      }

      // Camera placed out along the heading direction, looking back at the building
      const camDist = objRadius * 2.5 + 15;
      const rad = (headingDeg * Math.PI) / 180;
      const camX = centerX - Math.sin(rad) * camDist;
      const camZ = centerZ + Math.cos(rad) * camDist;
      const camY = objHeight * 0.55 + 1.6;

      const snapCam = new THREE.PerspectiveCamera(60, 1, 0.1, 2000);
      snapCam.position.set(camX, camY, camZ);
      snapCam.lookAt(centerX, objHeight * 0.4, centerZ);

      const SIZE = 1024;
      const snapRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      snapRenderer.setSize(SIZE, SIZE);
      snapRenderer.setClearColor(0x000000, 0);   // fully transparent background
      snapRenderer.render(snapScene, snapCam);

      const dataUrl = snapRenderer.domElement.toDataURL("image/png");

      snapScene.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      snapRenderer.dispose();

      return dataUrl;
    }
    window.renderCutout = renderCutout;

    // =====================================================================
    // 7.65 Real camera geometry: where the target actually sits in the photo's frame
    // =====================================================================
    const CAMERA_FOV_DEG = 80;   // typical horizontal FOV for phone/action-cam street imagery (Mapillary doesn't reliably report this)

    function bearingDeg(lat1, lng1, lat2, lng2) {
      const toRad = (d) => d * Math.PI / 180, toDeg = (r) => r * 180 / Math.PI;
      const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }
    function angleDiff(a, b) {   // shortest signed difference a - b, in [-180, 180]
      return ((a - b + 540) % 360) - 180;
    }

    // Where the target building actually falls in this photo's frame, based on real position/heading.
    function computeFraming(photo, targetLat, targetLng, targetRadius) {
      const [camLng, camLat] = photo.geometry.coordinates;
      const distance = distMeters(camLat, camLng, targetLat, targetLng);
      const bearingToTarget = bearingDeg(camLat, camLng, targetLat, targetLng);
      const offsetDeg = angleDiff(bearingToTarget, photo.compass_angle);
      const halfFov = CAMERA_FOV_DEG / 2;

      const visible = Math.abs(offsetDeg) <= halfFov;
      // perspective-correct horizontal position (not linear - a pinhole-camera tan mapping)
      const xFrac = 0.5 + 0.5 * (Math.tan((offsetDeg * Math.PI) / 180) / Math.tan((halfFov * Math.PI) / 180));
      // apparent size from real angular size at this distance
      const angularWidthDeg = (2 * Math.atan(targetRadius / Math.max(distance, 1)) * 180) / Math.PI;
      const widthFrac = angularWidthDeg / CAMERA_FOV_DEG;

      return { distance, offsetDeg, visible, xFrac, widthFrac, camLat, camLng };
    }

    function worldToLatLng(x, z) {

      const north = -z;
      return [centerLat + north / M_PER_DEG_LAT, centerLng + x / M_PER_DEG_LNG];

    return { x: p.x, z: p.z, radius };

  const b = buildings.get(id);
  if (!b) return null;
  const info = footprintInfo(b.footprint);
  return { x: info.x, z: info.z, radius: Math.max(info.length, info.width) / 2 };

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      // Cap the timestep: after a hitch (rebuilding buildings, loading data, a background tab)
      // a raw delta at 60 m/s would fling the camera dozens of metres in one frame.
      const delta = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      velocity.set(0, 0, 0);
      if (move.forward) velocity.z -= 1;
      if (move.back) velocity.z += 1;
      if (move.left) velocity.x -= 1;
      if (move.right) velocity.x += 1;
      velocity.normalize();

      if (controls.isLocked) {
        controls.moveRight(velocity.x * speed * delta);
        controls.moveForward(-velocity.z * speed * delta);
        if (move.up) camera.position.y += speed * delta;
        if (move.down) camera.position.y -= speed * delta;
      }
      // stay above the terrain
      const floor = elevationAt(camera.position.x, camera.position.z) + 1.7;
      if (camera.position.y < floor) camera.position.y = floor;

      sky.position.copy(camera.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Handy for debugging from the console
    window.__scene = { scene, camera, renderer };
    window.__wp = {
      buildings, pick, addModelFile, undo, elevationAt, terrain, terrainMesh,
      meshes: () => buildingMeshes,
      env: envGroup,
      state: () => ({ selected, removed: [...removed], placements }),
      select: (id) => { selected = id; updateHighlight(); updateUI(); },
      actions: { deleteSelected, replaceWithModel, placeModel, rotateSelected, adjustHeight }
    };
  </script>
</body>
