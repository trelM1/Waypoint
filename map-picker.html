<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Map Picker</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #app { display: flex; height: 100%; }
  #map { flex: 1; }
  #panel {
    width: 260px;
    height: 100%;
    box-sizing: border-box;
    background: white;
    padding: 16px;
    font-family: sans-serif;
    font-size: 14px;
    box-shadow: -1px 0 4px rgba(0,0,0,0.15);
    overflow-y: auto;
  }
  #panel label { display: block; margin-top: 8px; }
  #radiusValue { font-weight: bold; }
  #info { margin-top: 8px; color: #555; font-size: 12px; }
</style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="panel">
      <strong>Map Picker</strong>
      <div id="info">Click the map to set a center point.</div>
      <label>
        Radius: <span id="radiusValue">300</span> m
        <input type="range" id="radiusSlider" min="50" max="2000" step="50" value="300" style="width:100%">
      </label>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    mapboxgl.accessToken = MAPBOX_TOKEN;

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/light-v11",
      center: [-79.3832, 43.6532], // default: Toronto, change as needed
      zoom: 14
    });

    let center = null;
    let radiusMeters = 300;
    let marker = null;

    function updateCircle() {
      if (!center) return;

      const circle = turf.circle(center, radiusMeters / 1000, { units: "kilometers" });

      const source = map.getSource("radius-circle");
      if (source) {
        source.setData(circle);
      } else {
        map.addSource("radius-circle", { type: "geojson", data: circle });
        map.addLayer({
          id: "radius-circle-fill",
          type: "fill",
          source: "radius-circle",
          paint: { "fill-color": "#1d8fe1", "fill-opacity": 0.2 }
        });
        map.addLayer({
          id: "radius-circle-outline",
          type: "line",
          source: "radius-circle",
          paint: { "line-color": "#1d8fe1", "line-width": 2 }
        });
      }

      document.getElementById("info").textContent =
        `Center: ${center[1].toFixed(5)}, ${center[0].toFixed(5)} | Radius: ${radiusMeters} m`;
    }

    map.on("click", (e) => {
      center = [e.lngLat.lng, e.lngLat.lat];

      if (marker) marker.remove();
      marker = new mapboxgl.Marker({ color: "#1d8fe1" }).setLngLat(center).addTo(map);

      updateCircle();
    });

    document.getElementById("radiusSlider").addEventListener("input", (e) => {
      radiusMeters = parseInt(e.target.value, 10);
      document.getElementById("radiusValue").textContent = radiusMeters;
      updateCircle();
    });

    function getSelection() {
      if (!center) return null;
      return { center, radiusMeters };
    }
  </script>
</body>
</html>
